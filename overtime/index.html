<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Tracker</title>
    <style>
        /* Minimalist, clean styling */
        :root {
            --bg-color: #fcfcfc;
            --surface-color: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.1);
            --accent: #4A90E2;
            --border-radius: 16px;
        }

        /* Essential for preventing fields from breaking out of their boxes */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        
        button {
            background: var(--surface-color);
            border: 1px solid #eee;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        button:hover { box-shadow: var(--shadow-soft); }
        
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
            max-width: 900px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .controls-grid { grid-template-columns: 1fr; }
            .banks-grid { grid-template-columns: 1fr !important; }
        }

        .panel {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
        }

        /* Controls Panel */
        .generator {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #fafafa;
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            cursor: grab;
            transition: all 0.2s;
            flex-grow: 1;
        }
        .generator:active { cursor: grabbing; border-color: var(--accent); }
        
        /* Icon backgrounds are now pure white */
        .icon-img { 
            width: 48px; 
            height: 48px; 
            border-radius: 8px; 
            object-fit: cover; 
            background: #ffffff; 
            border: 1px solid #f0f0f0; /* Soft border to define white icons against white background */
            flex-shrink: 0;
        }
        
        .form-group { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; }
        .row-group { display: flex; gap: 0.8rem; width: 100%; }
        
        input, select {
            padding: 0.8rem;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            background: #fafafa;
            width: 100%;
        }
        .btn-primary { background: var(--text-main); color: white; border: none; padding: 0.8rem; }
        .btn-primary:hover { background: #000; }

        /* Banks */
        .banks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .bank {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            min-height: 300px;
            border: 2px solid transparent;
            transition: border 0.2s;
        }
        .bank.drag-over { border-color: var(--accent); background: #f4f9ff; }
        .bank-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem; }
        .bank-header h2 { margin: 0; font-size: 1.2rem; }
        .total { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        .item-list { list-style: none; padding: 0; margin: 0; }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .item-details { display: flex; align-items: center; gap: 1rem; }
        .item-icon { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: #ffffff; border: 1px solid #f0f0f0; }
        .item-info { display: flex; flex-direction: column; }
        .item-title { font-weight: 500; }
        .item-val { color: var(--text-muted); font-size: 0.9rem; }
        .item-actions button { padding: 0.3rem 0.6rem; font-size: 0.8rem; margin-left: 0.5rem; border: none; background: #f5f5f5; }
        .item-actions button:hover { background: #e0e0e0; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.2); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 10;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; padding: 2rem; border-radius: var(--border-radius);
            box-shadow: var(--shadow-hover); width: 100%; max-width: 360px;
        }
        .modal h3 { margin-top: 0; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <h1>Bonus Tracker</h1>
        <button id="btn-open-settings">⚙️ Settings</button>
    </header>

    <div class="main-container">
        
        <div class="controls-grid">
            
            <div class="panel">
                <h3 style="margin-top:0; margin-bottom: 1rem;">Quick Add</h3>
                <div class="generator draggable" draggable="true" id="drag-overtime">
                    <img id="img-overtime" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Overtime icon">
                    <div>
                        <div id="label-overtime-title" style="font-weight: 600;">Overtime</div>
                        <div id="label-overtime-value" style="color: var(--text-muted);">£20</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3 style="margin-top:0; margin-bottom: 1rem;">Custom Bonus</h3>
                <div class="form-group">
                    <div style="display:flex; gap:1rem; align-items:center;">
                        <img id="img-custom-preview" class="icon-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Custom icon">
                        <input type="text" id="custom-title" placeholder="e.g. Gift, Reward">
                    </div>
                    <div class="row-group">
                        <input type="number" id="custom-amount" placeholder="Amount (£)" min="0">
                        <select id="custom-user">
                            <option value="Christopher">Christopher</option>
                            <option value="Renata">Renata</option>
                        </select>
                    </div>
                    <input type="text" id="custom-img-url" placeholder="Icon image URL (optional)">
                    <button class="btn-primary" id="btn-add-custom">Add to Bank</button>
                </div>
            </div>

        </div>

        <div class="banks-grid">
            <div class="bank dropzone" id="bank-Christopher" data-user="Christopher">
                <div class="bank-header">
                    <h2>Christopher</h2>
                    <span class="total" id="total-Christopher">£0</span>
                </div>
                <ul class="item-list" id="list-Christopher"></ul>
            </div>

            <div class="bank dropzone" id="bank-Renata" data-user="Renata">
                <div class="bank-header">
                    <h2>Renata</h2>
                    <span class="total" id="total-Renata">£0</span>
                </div>
                <ul class="item-list" id="list-Renata"></ul>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-settings">
        <div class="modal">
            <h3>App Settings</h3>
            <div class="form-group">
                <label>Overtime Title</label>
                <input type="text" id="set-overtime-title">
                <label>Overtime Value (£)</label>
                <input type="number" id="set-overtime-value">
                <label>Overtime Image URL</label>
                <input type="text" id="set-overtime-img" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button id="btn-close-settings">Cancel</button>
                <button class="btn-primary" id="btn-save-settings">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-edit">
        <div class="modal">
            <h3>Edit Bonus</h3>
            <div class="form-group">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-user">
                <label>Title</label>
                <input type="text" id="edit-title">
                <label>Amount (£)</label>
                <input type="number" id="edit-amount">
            </div>
            <div class="modal-actions">
                <button id="btn-close-edit">Cancel</button>
                <button class="btn-primary" id="btn-save-edit">Update</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Global State variables
        let appSettings = {
            overtimeTitle: "Overtime",
            overtimeValue: 20,
            overtimeImg: ""
        };

        // DOM Elements
        const dragOvertime = document.getElementById('drag-overtime');
        const customTitle = document.getElementById('custom-title');
        const customAmount = document.getElementById('custom-amount');
        const customUser = document.getElementById('custom-user');
        const customImgUrl = document.getElementById('custom-img-url');
        const customImgPreview = document.getElementById('img-custom-preview');
        const emptyImage = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";
        
        // Sign in Anonymously
        signInAnonymously(auth).then(() => {
            initApp();
        }).catch((error) => {
            console.error("Auth Error:", error);
            alert("Authentication failed. Check console.");
        });

        function initApp() {
            // Listen for Settings
            const settingsRef = ref(db, 'settings');
            onValue(settingsRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    appSettings = { ...appSettings, ...data };
                    updateSettingsUI();
                }
            });

            // Listen for Banks
            onValue(ref(db, 'users/Christopher/items'), (snapshot) => renderBank('Christopher', snapshot.val()));
            onValue(ref(db, 'users/Renata/items'), (snapshot) => renderBank('Renata', snapshot.val()));
        }

        function updateSettingsUI() {
            document.getElementById('label-overtime-title').innerText = appSettings.overtimeTitle;
            document.getElementById('label-overtime-value').innerText = `£${appSettings.overtimeValue}`;
            document.getElementById('img-overtime').src = appSettings.overtimeImg || emptyImage;
        }

        // Live preview for custom image URL
        customImgUrl.addEventListener('input', (e) => {
            const url = e.target.value.trim();
            customImgPreview.src = url || emptyImage;
        });

        // Drag and Drop Logic
        dragOvertime.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', 'overtime');
            e.dataTransfer.effectAllowed = 'copy';
        });

        document.querySelectorAll('.dropzone').forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });
            zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                const type = e.dataTransfer.getData('text/plain');
                if (type === 'overtime') {
                    const user = zone.dataset.user;
                    addBonus(user, appSettings.overtimeTitle, appSettings.overtimeValue, appSettings.overtimeImg);
                }
            });
        });

        // Add Custom Logic
        document.getElementById('btn-add-custom').addEventListener('click', () => {
            const title = customTitle.value.trim();
            const amount = parseFloat(customAmount.value);
            const user = customUser.value;
            const img = customImgUrl.value.trim();

            if (title && !isNaN(amount)) {
                addBonus(user, title, amount, img);
                // Clear fields
                customTitle.value = ''; 
                customAmount.value = '';
                customImgUrl.value = '';
                customImgPreview.src = emptyImage;
            } else {
                alert("Please enter a valid title and amount.");
            }
        });

        // Database Functions
        function addBonus(user, title, amount, img) {
            const itemsRef = ref(db, `users/${user}/items`);
            push(itemsRef, { 
                title, 
                amount: parseFloat(amount), 
                img: img || "",
                timestamp: Date.now() 
            });
        }

        function deleteBonus(user, id) {
            remove(ref(db, `users/${user}/items/${id}`));
        }

        function renderBank(user, itemsObj) {
            const listEl = document.getElementById(`list-${user}`);
            const totalEl = document.getElementById(`total-${user}`);
            listEl.innerHTML = '';
            
            let total = 0;
            if (itemsObj) {
                // Sort by timestamp if needed, but Firebase objects maintain insertion order relatively well
                Object.entries(itemsObj).forEach(([id, data]) => {
                    total += data.amount;
                    const itemImg = data.img || emptyImage;
                    const li = document.createElement('li');
                    li.className = 'item';
                    li.innerHTML = `
                        <div class="item-details">
                            <img class="item-icon" src="${itemImg}" alt="icon">
                            <div class="item-info">
                                <span class="item-title">${data.title}</span>
                                <span class="item-val">£${data.amount}</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button onclick="openEdit('${user}', '${id}', '${data.title}', ${data.amount})">Edit</button>
                            <button onclick="deleteItem('${user}', '${id}')">✕</button>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            }
            totalEl.innerText = `£${total}`;
        }

        // Expose functions to window for inline onclick handlers
        window.deleteItem = (user, id) => {
            if(confirm('Are you sure you want to delete this?')) deleteBonus(user, id);
        };
        
        window.openEdit = (user, id, title, amount) => {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-user').value = user;
            document.getElementById('edit-title').value = title;
            document.getElementById('edit-amount').value = amount;
            document.getElementById('modal-edit').classList.add('active');
        };

        // Modals Logic
        document.getElementById('btn-close-edit').addEventListener('click', () => document.getElementById('modal-edit').classList.remove('active'));
        document.getElementById('btn-save-edit').addEventListener('click', () => {
            const user = document.getElementById('edit-user').value;
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value;
            const amount = parseFloat(document.getElementById('edit-amount').value);
            
            update(ref(db, `users/${user}/items/${id}`), { title, amount }).then(() => {
                document.getElementById('modal-edit').classList.remove('active');
            });
        });

        // Settings Logic
        document.getElementById('btn-open-settings').addEventListener('click', () => {
            document.getElementById('set-overtime-title').value = appSettings.overtimeTitle;
            document.getElementById('set-overtime-value').value = appSettings.overtimeValue;
            document.getElementById('set-overtime-img').value = appSettings.overtimeImg;
            document.getElementById('modal-settings').classList.add('active');
        });

        document.getElementById('btn-close-settings').addEventListener('click', () => document.getElementById('modal-settings').classList.remove('active'));
        document.getElementById('btn-save-settings').addEventListener('click', () => {
            const newSettings = {
                overtimeTitle: document.getElementById('set-overtime-title').value,
                overtimeValue: parseFloat(document.getElementById('set-overtime-value').value),
                overtimeImg: document.getElementById('set-overtime-img').value
            };
            set(ref(db, 'settings'), newSettings).then(() => {
                document.getElementById('modal-settings').classList.remove('active');
            });
        });
    </script>
</body>
</html>
