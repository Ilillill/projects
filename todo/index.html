<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <style>
        :root {
            /* Ultra-Minimalist Professional Theme */
            --bg-color: #ffffff; 
            --surface: #ffffff; 
            --input-bg: #f5f5f7; 
            --border: #e5e5ea;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #007aff; /* Switched to a professional system blue */
            --hover-bg: #fbfbfd;
            --task-bg: #ffffff;
            --delete-btn-color: #ff3b30;
            
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-modal: 0 12px 40px rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px; 
            display: flex;
            flex-direction: column; 
            height: 100vh;
            box-sizing: border-box;
            gap: 16px; 
        }

        /* --- Streamlined Top Toolbar --- */
        #top-toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        #add-task-form {
            flex: 1; /* Takes up remaining space gracefully */
            min-width: 200px;
        }

        .toolbar-section {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 4px;
        }

        .text-input {
            padding: 8px 12px; 
            border-radius: 6px;
            border: 1px solid transparent;
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .text-input:focus {
            background: var(--surface);
            border: 1px solid var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        
        button.action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px; 
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        
        button.action-btn:hover { opacity: 0.85; }
        
        /* Tiny Export Icon */
        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background: var(--input-bg);
            color: var(--text);
        }

        /* --- Main Board & Categories --- */
        #main-board {
            flex: 1;
            display: flex;
            flex-direction: column; 
            gap: 12px; 
            overflow-y: auto;
            padding-right: 4px; 
        }

        /* Ghost Intake Bench */
        #intake-container {
            display: none; /* Hidden by default */
            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--border);
            background: var(--hover-bg);
            min-height: 40px;
        }

        .category-box {
            background: var(--surface);
            border-radius: 8px;
            display: flex;
            flex-direction: row; 
            transition: box-shadow 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        .category-sidebar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px; 
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s;
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            background: #ffffff; 
            border-right: 1px solid var(--border);
        }

        .category-sidebar:hover { background: var(--input-bg); }

        /* User Image Styling (75x75) */
        .category-image {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px; 
            box-shadow: var(--shadow-sm);
            background: #ffffff; 
            display: block; 
        }

        .fallback-icon {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .task-list {
            flex: 1;
            min-height: 60px; 
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap; 
            align-content: flex-start; 
            gap: 8px; 
            padding: 10px; 
            border-radius: 8px;
        }

        /* Minimal Task Cards */
        .task-card {
            background: var(--task-bg);
            padding: 6px 12px; 
            border-radius: 6px;
            cursor: pointer; 
            box-shadow: var(--shadow-sm);
            user-select: none;
            display: inline-flex; 
            align-items: center;
            width: fit-content; 
            max-width: 100%; 
            box-sizing: border-box;
            border: 1px solid var(--border); 
            transition: box-shadow 0.2s, transform 0.1s;
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .task-card span {
            word-break: break-word; 
            font-size: 0.85rem; 
            font-weight: 400;
        }

        .task-card:active { cursor: grabbing; opacity: 0.7; transform: scale(0.97); }
        
        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; transition: opacity 0.2s;
        }
        
        .modal-box {
            background: var(--surface); padding: 24px; border-radius: 12px;
            width: 300px; box-shadow: var(--shadow-modal);
            border: 1px solid var(--border);
            transform: scale(0.97); transition: transform 0.2s;
        }
        
        .modal-overlay.active { opacity: 1; }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-box h3 { margin-top: 0; margin-bottom: 16px; font-size: 1rem; color: var(--text); font-weight: 500;}
        .modal-box input { margin-bottom: 12px; }
        .modal-btn-group { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        
        .btn-cancel { 
            background: var(--input-bg); color: var(--text); 
            border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;
        }
        .btn-cancel:hover { background: #e5e5ea; }
        .btn-delete { 
            background: var(--delete-btn-color); color: #fff; 
            border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;
        }
        .btn-delete:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Category Modal -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Manage Category</h3>
            <input type="text" id="modal-cat-name" class="text-input" placeholder="Category Name" autocomplete="off" required>
            <input type="url" id="modal-cat-image" class="text-input" placeholder="Image URL (Required)" autocomplete="off" required>
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeCategoryModal()">Cancel</button>
                <button class="btn-delete" id="modal-delete-btn">Delete</button>
                <button class="action-btn" id="modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Manage Task</h3>
            <input type="text" id="modal-task-text" class="text-input" autocomplete="off">
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
                <button class="btn-delete" id="modal-task-delete-btn">Delete</button>
                <button class="action-btn" id="modal-task-save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Compact Toolbar -->
    <div id="top-toolbar">
        <form id="add-task-form">
            <!-- No button, just pure input. Hitting Enter submits. -->
            <input type="text" id="new-task-input" class="text-input" placeholder="New" autocomplete="off" required>
        </form>

        <div class="divider"></div>

        <form id="add-category-form" class="toolbar-section">
            <input type="text" id="new-category-name" class="text-input" placeholder="Category Name" autocomplete="off" required style="width: 130px;">
            <input type="url" id="new-category-image" class="text-input" placeholder="Icon URL" autocomplete="off" required style="width: 130px;">
            <button type="submit" class="action-btn">Add Category</button>
        </form>
        
        <button id="export-btn" class="icon-btn" title="Export to TXT">
            <!-- Clean SVG Download Icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </button>
    </div>

    <div id="main-board">
        <!-- Ghost Intake Bench (No Drop Zone, Only grows when populated) -->
        <div id="intake-container"></div>

        <!-- Dynamic categories inject here -->

        <!-- Editable Repeatable Tasks Bench -->
        <div class="category-box" id="repeatable-container">
            <div class="category-sidebar" id="repeatable-sidebar" title="Edit Repeatable Tasks">
                <!-- Injected via JS -->
            </div>
            <div class="task-list drop-zone" id="repeatable_tasks"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, onSnapshot, updateDoc, setDoc, doc, deleteDoc, serverTimestamp, writeBatch, query, where } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        });
        
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const tasksRef = collection(db, "command_board_tasks");
        const categoriesRef = collection(db, "command_board_categories"); 

        let currentTasks = {};
        let currentCategories = {};
        let currentDragSourceCategory = ''; 
        let currentEditingCatId = null; 
        let currentEditingTaskId = null;

        signInAnonymously(auth).then(() => {
            onSnapshot(categoriesRef, (snapshot) => {
                currentCategories = {};
                snapshot.forEach(doc => { currentCategories[doc.id] = doc.data(); });
                renderBoard();
            }, (error) => console.error("Category Error: ", error));

            onSnapshot(tasksRef, (snapshot) => {
                currentTasks = {};
                snapshot.forEach(doc => { currentTasks[doc.id] = doc.data(); });
                renderBoard();
            }, (error) => console.error("Task Error: ", error));
        }).catch((error) => {
            console.error("Auth Failed:", error);
            alert("Database connection requires authentication.");
        });

        function renderBoard() {
            const mainBoard = document.getElementById('main-board');
            const intakeZone = document.getElementById('intake-container');
            const repeatZone = document.getElementById('repeatable_tasks');
            const repeatSidebar = document.getElementById('repeatable-sidebar');
            
            // Clean up old dynamic categories
            Array.from(mainBoard.children).forEach(child => {
                if (child.id !== 'intake-container' && child.id !== 'repeatable-container') {
                    mainBoard.removeChild(child);
                }
            });
            
            intakeZone.innerHTML = '';
            repeatZone.innerHTML = '';

            // Handle Ghost Intake Visibility
            const intakeTasks = Object.entries(currentTasks).filter(([id, t]) => t.category === 'intake');
            if (intakeTasks.length === 0) {
                intakeZone.style.display = 'none';
            } else {
                intakeZone.style.display = 'flex';
            }

            // Extract Repeatable Category config and filter out from dynamic list
            const repeatCat = currentCategories['repeatable_tasks'] || { name: 'Repeatable Tasks', imageUrl: '' };
            const safeRepeatImage = (repeatCat.imageUrl || '').replace(/'/g, "\\'");
            
            // Render Repeatable Sidebar Image or Fallback SVG
            if (safeRepeatImage) {
                repeatSidebar.innerHTML = `<img src="${safeRepeatImage}" alt="Repeatable Tasks" class="category-image">`;
            } else {
                repeatSidebar.innerHTML = `<div class="fallback-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></div>`;
            }
            repeatSidebar.onclick = () => openCategoryModal('repeatable_tasks', 'Repeatable Tasks', safeRepeatImage);

            const sortedCategories = Object.entries(currentCategories)
                .filter(([id]) => id !== 'repeatable_tasks')
                .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));

            const repeatBenchElement = document.getElementById('repeatable-container');

            sortedCategories.forEach(([catId, cat]) => {
                const catBox = document.createElement('div');
                catBox.className = 'category-box';
                
                const safeName = (cat.name || 'Unnamed').replace(/'/g, "\\'");
                const safeImage = (cat.imageUrl || '').replace(/'/g, "\\'");
                
                const sidebarContent = cat.imageUrl && cat.imageUrl.trim() !== "" 
                    ? `<img src="${cat.imageUrl}" alt="${cat.name}" class="category-image">` 
                    : `<div class="fallback-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg></div>`;

                catBox.innerHTML = `
                    <div class="category-sidebar" onclick="openCategoryModal('${catId}', '${safeName}', '${safeImage}')" title="${cat.name}">
                        ${sidebarContent}
                    </div>
                    <div class="task-list drop-zone" id="${catId}"></div>
                `;
                mainBoard.insertBefore(catBox, repeatBenchElement);
            });

            // Drag and Drop (Explicitly excluding intake)
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault(); 
                    zone.parentElement.style.boxShadow = `0 0 0 2px var(--accent), var(--shadow-sm)`;
                });
                zone.addEventListener('dragleave', () => {
                    zone.parentElement.style.boxShadow = 'none';
                    zone.parentElement.style.border = '1px solid var(--border)';
                });
                zone.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    zone.parentElement.style.boxShadow = 'none';
                    
                    const taskId = e.dataTransfer.getData('text/plain');
                    const targetCategory = zone.id;
                    const draggedTask = currentTasks[taskId];

                    if (!draggedTask) return;

                    if (currentDragSourceCategory === 'repeatable_tasks' && targetCategory !== 'repeatable_tasks') {
                         try { 
                            await addDoc(tasksRef, { text: draggedTask.text, category: targetCategory, createdAt: serverTimestamp() });
                         } catch (error) { alert("FIREBASE ERROR: " + error.message); }
                    } 
                    else {
                        if (draggedTask.category !== targetCategory) {
                             try { await updateDoc(doc(db, "command_board_tasks", taskId), { category: targetCategory }); } 
                             catch (error) { alert("FIREBASE ERROR: " + error.message); }
                        }
                    }
                });
            });

            // Global Alphabetical Sort for tasks
            const sortedTasks = Object.entries(currentTasks).sort((a, b) => {
                return (a[1].text || '').localeCompare(b[1].text || '');
            });

            sortedTasks.forEach(([taskId, task]) => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.draggable = true;
                card.id = taskId;
                
                // Subtle visual distinction
                if(task.category === 'intake') { card.style.borderLeft = '3px solid var(--text-secondary)'; }
                else if(task.category === 'repeatable_tasks') { card.style.borderLeft = '3px solid #ff9800'; }
                else { card.style.borderLeft = '3px solid var(--accent)'; }
                
                card.innerHTML = `<span>${task.text}</span>`;
                
                card.addEventListener('click', () => { openTaskModal(taskId, task.text); });

                card.addEventListener('dragstart', (e) => {
                    currentDragSourceCategory = task.category; 
                    e.dataTransfer.setData('text/plain', taskId);
                    setTimeout(() => card.style.opacity = '0.4', 0);
                });
                card.addEventListener('dragend', () => card.style.opacity = '1');

                let dropZone = document.getElementById(task.category);
                if (!dropZone && task.category === 'intake') dropZone = intakeZone;
                
                if (dropZone) dropZone.appendChild(card);
            });
        }

        document.getElementById('add-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('new-task-input');
            if (input.value.trim() === '') return;
            const taskText = input.value;
            input.value = '';
            input.focus();
            try { await addDoc(tasksRef, { text: taskText, category: 'intake', createdAt: serverTimestamp() }); } 
            catch (error) { alert("FIREBASE ERROR: " + error.message); }
        });

        document.getElementById('add-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('new-category-name');
            const imageInput = document.getElementById('new-category-image');
            if (nameInput.value.trim() === '' || imageInput.value.trim() === '') return;
            
            try {
                await addDoc(categoriesRef, { 
                    name: nameInput.value.trim(), 
                    imageUrl: imageInput.value.trim(),
                    createdAt: serverTimestamp() 
                });
                nameInput.value = '';
                imageInput.value = '';
            } catch (error) { alert("FIREBASE ERROR: " + error.message); }
        });

        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10); 
        }

        function hideModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 200);
        }

        window.openCategoryModal = (catId, currentName, currentImage) => {
            currentEditingCatId = catId;
            const nameInput = document.getElementById('modal-cat-name');
            
            nameInput.value = currentName;
            document.getElementById('modal-cat-image').value = currentImage;
            
            // Protect the Repeatable Tasks systemic category from name changes and deletion
            if (catId === 'repeatable_tasks') {
                nameInput.disabled = true;
                document.getElementById('modal-delete-btn').disabled = true;
            } else {
                nameInput.disabled = false;
                document.getElementById('modal-delete-btn').disabled = false;
            }

            showModal('category-modal');
            document.getElementById('modal-cat-image').focus();
        };

        window.closeCategoryModal = () => {
            hideModal('category-modal');
            currentEditingCatId = null;
        };

        document.getElementById('modal-save-btn').addEventListener('click', async () => {
            if (!currentEditingCatId) return;
            const newName = document.getElementById('modal-cat-name').value.trim();
            const newImg = document.getElementById('modal-cat-image').value.trim();
            
            try {
                if (currentEditingCatId === 'repeatable_tasks') {
                    // Use setDoc with merge to ensure the document gets created if it doesn't exist yet
                    await setDoc(doc(db, "command_board_categories", "repeatable_tasks"), {
                        name: "Repeatable Tasks", 
                        imageUrl: newImg 
                    }, { merge: true });
                } else if (newName !== "") {
                    await updateDoc(doc(db, "command_board_categories", currentEditingCatId), { 
                        name: newName, 
                        imageUrl: newImg 
                    });
                }
                closeCategoryModal();
            } catch (error) { alert("FIREBASE ERROR: " + error.message); }
        });

        document.getElementById('modal-delete-btn').addEventListener('click', async () => {
            if (!currentEditingCatId || currentEditingCatId === 'repeatable_tasks') return;
            if (confirm("Delete this category? Tasks inside will return to the Intake bench.")) {
                try {
                    const q = query(tasksRef, where("category", "==", currentEditingCatId));
                    const snapshot = await getDocs(q);
                    const batch = writeBatch(db);
                    snapshot.forEach((taskDoc) => { batch.update(taskDoc.ref, { category: 'intake' }); });
                    await batch.commit();
                    await deleteDoc(doc(db, "command_board_categories", currentEditingCatId));
                    closeCategoryModal();
                } catch (error) { alert("FIREBASE ERROR: " + error.message); }
            }
        });

        window.openTaskModal = (taskId, text) => {
            currentEditingTaskId = taskId;
            document.getElementById('modal-task-text').value = text;
            showModal('task-modal');
            document.getElementById('modal-task-text').focus();
        };

        window.closeTaskModal = () => {
            hideModal('task-modal');
            currentEditingTaskId = null;
        };

        document.getElementById('modal-task-save-btn').addEventListener('click', async () => {
            if (!currentEditingTaskId) return;
            const newText = document.getElementById('modal-task-text').value.trim();
            if (newText !== "") {
                try {
                    await updateDoc(doc(db, "command_board_tasks", currentEditingTaskId), { text: newText });
                    closeTaskModal();
                } catch (error) { alert("FIREBASE ERROR: " + error.message); }
            }
        });

        document.getElementById('modal-task-delete-btn').addEventListener('click', async () => {
            if (!currentEditingTaskId) return;
            try {
                await deleteDoc(doc(db, "command_board_tasks", currentEditingTaskId));
                closeTaskModal();
            } catch (error) { alert("FIREBASE ERROR: " + error.message); }
        });

        // --- Export Logic ---
        document.getElementById('export-btn').addEventListener('click', () => {
            let exportData = "=== INTAKE BENCH ===\n";
            const intakeTasks = Object.values(currentTasks).filter(t => t.category === 'intake');
            if (intakeTasks.length === 0) exportData += "(Empty)\n";
            intakeTasks.sort((a,b) => (a.text || '').localeCompare(b.text || '')).forEach(t => exportData += `- ${t.text}\n`);
            exportData += "\n";

            const sortedCategories = Object.entries(currentCategories)
                .filter(([id]) => id !== 'repeatable_tasks')
                .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));

            sortedCategories.forEach(([catId, cat]) => {
                exportData += `=== ${(cat.name || 'UNNAMED').toUpperCase()} ===\n`;
                const catTasks = Object.values(currentTasks).filter(t => t.category === catId);
                if (catTasks.length === 0) { exportData += "(Empty)\n"; } 
                else { 
                    catTasks.sort((a,b) => (a.text || '').localeCompare(b.text || '')).forEach(t => exportData += `- ${t.text}\n`); 
                }
                exportData += "\n";
            });

            exportData += "=== 📅 REPEATABLE TASKS ===\n";
            const repeatableTasks = Object.values(currentTasks).filter(t => t.category === 'repeatable_tasks');
            if (repeatableTasks.length === 0) exportData += "(Empty)\n";
            repeatableTasks.sort((a,b) => (a.text || '').localeCompare(b.text || '')).forEach(t => exportData += `- ${t.text}\n`);
            exportData += "\n";

            const blob = new Blob([exportData], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const dateStr = new Date().toISOString().split('T')[0];
            a.download = `Tasks_Export_${dateStr}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
