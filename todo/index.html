<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <style>
        :root {
            --bg-color: #fbfbfd; 
            --surface: #ffffff; 
            --input-bg: #f5f5f7; 
            --border: #e5e5ea;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #007aff; 
            --hover-bg: #f5f5f7;
            --task-bg: #ffffff;
            --delete-btn-color: #ff3b30;
            
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-modal: 0 12px 40px rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px; 
            display: flex;
            flex-direction: column; 
            height: 100vh;
            box-sizing: border-box;
            gap: 16px; 
        }

        #top-toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        #add-task-form {
            flex: 1; 
            min-width: 200px;
        }

        .toolbar-section {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 4px;
        }

        .text-input {
            padding: 8px 12px; 
            border-radius: 6px;
            border: 1px solid transparent;
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .text-input:focus {
            background: var(--surface);
            border: 1px solid var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .file-label {
            display: inline-block;
            width: 140px;
            cursor: pointer;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .file-label:hover { background: #e8e8ed; }
        .file-label.has-file { color: var(--accent); font-weight: 500; background: #e5f0ff; }
        
        button.action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px; 
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        button.action-btn:hover { opacity: 0.85; }
        
        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background: var(--input-bg);
            color: var(--text);
        }

        #board-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 4px;
        }

        #intake-container {
            display: none; 
            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            padding: 12px;
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            min-height: 40px;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0; /* Prevents container from collapsing and causing overlap */
        }

        #main-board {
            column-count: auto;
            column-width: 320px;
            column-gap: 16px;
            width: 100%;
        }

        .category-box {
            background: var(--surface);
            border-radius: 8px;
            display: flex;
            flex-direction: column; 
            transition: box-shadow 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            break-inside: avoid; 
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px; 
            cursor: pointer;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            background: #fbfbfd; 
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        
        .category-header:hover {
            background: #f1f1f4;
        }

        .category-image {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 4px; 
            background: transparent; 
            display: block; 
        }
        
        .category-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
        }

        .fallback-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .task-list {
            flex: 1;
            min-height: 40px; 
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap; 
            align-content: flex-start; 
            gap: 4px; 
            padding: 8px; 
            border-radius: 8px;
        }

        .task-card {
            background: var(--task-bg);
            padding: 2px 6px; 
            border-radius: 6px;
            cursor: pointer; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            user-select: none;
            display: inline-flex; 
            align-items: center;
            width: fit-content; 
            max-width: 100%; 
            box-sizing: border-box;
            border: 1px solid transparent; 
            transition: box-shadow 0.2s, transform 0.1s;
        }

        .task-card.task-completed {
            padding: 2px 6px;
            font-style: italic;
            border-left: 2px solid var(--border) !important;
            color: var(--text-secondary);
            background: #fafafa;
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .task-card.task-completed:hover {
            box-shadow: var(--shadow-sm);
        }

        .task-card span {
            word-break: break-word; 
            font-size: 0.7rem; 
            font-weight: 400;
        }

        .task-date {
            font-size: 0.55rem;
            color: #a0a0a5;
            margin-left: 4px;
            font-style: normal;
        }

        .task-card:active { cursor: grabbing; opacity: 0.7; transform: scale(0.97); }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; transition: opacity 0.2s;
        }
        
        .modal-box {
            background: var(--surface); padding: 24px; border-radius: 12px;
            width: 300px; box-shadow: var(--shadow-modal);
            border: 1px solid var(--border);
            transform: scale(0.97); transition: transform 0.2s;
        }

        #completed-modal .modal-box {
            width: 80%;
            max-width: 700px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        
        #completed-modal-list {
            flex: 1;
            overflow-y: auto;
            background: var(--input-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }
        
        .modal-overlay.active { opacity: 1; }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-box h3 { margin-top: 0; margin-bottom: 16px; font-size: 1rem; color: var(--text); font-weight: 500;}
        .modal-box input { margin-bottom: 12px; }
        .modal-btn-group { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
        
        .btn-cancel { 
            background: var(--input-bg); color: var(--text); 
            border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;
        }
        .btn-cancel:hover { background: #e5e5ea; }
        .btn-delete { 
            background: var(--delete-btn-color); color: #fff; 
            border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;
        }
        .btn-delete:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Category Modal -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Manage Category</h3>
            <input type="text" id="modal-cat-name" class="text-input" placeholder="Category Name" autocomplete="off" required>
            
            <input type="file" id="modal-cat-file" accept="image/png, image/jpeg" style="display: none;">
            <label for="modal-cat-file" id="modal-cat-file-label" class="text-input file-label" style="width: 100%;">Upload New Icon (Optional)</label>
            
            <input type="hidden" id="modal-cat-existing-image">

            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeCategoryModal()">Cancel</button>
                <button class="btn-delete" id="modal-delete-btn">Delete</button>
                <button class="action-btn" id="modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Manage Task</h3>
            <input type="text" id="modal-task-text" class="text-input" autocomplete="off">
            <input type="text" id="modal-task-date" class="text-input" autocomplete="off" placeholder="Completion Date (e.g., 2026-08-13)" style="display: none;">
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
                <button class="btn-delete" id="modal-task-delete-btn">Delete</button>
                <button class="action-btn" id="modal-task-save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Completed Tasks Window Modal -->
    <div id="completed-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Completed Tasks</h3>
            <div id="completed-modal-list" class="task-list"></div>
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeCompletedModal()">Close</button>
                <button class="btn-delete" id="clear-all-completed-btn">Clear All</button>
            </div>
        </div>
    </div>

    <div id="top-toolbar">
        <form id="add-task-form">
            <input type="text" id="new-task-input" class="text-input" placeholder="New" autocomplete="off" required>
        </form>

        <div class="divider"></div>

        <form id="add-category-form" class="toolbar-section">
            <input type="text" id="new-category-name" class="text-input" placeholder="Category Name" autocomplete="off" required style="width: 130px;">
            
            <input type="file" id="new-category-file" accept="image/png, image/jpeg" style="display: none;" required>
            <label for="new-category-file" id="new-category-file-label" class="text-input file-label">Choose Icon...</label>
            
            <button type="submit" class="action-btn" id="add-category-btn">Add Category</button>
        </form>

        <div class="divider"></div>

        <button id="completed_tasks" class="action-btn drop-zone" style="background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border);">
            ✓ Completed
        </button>
        
        <button id="export-btn" class="icon-btn" title="Export to TXT">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </button>
    </div>

    <div id="board-wrapper">
        <div id="intake-container" class="drop-zone"></div>
        
        <div id="main-board">
            <div class="category-box" id="repeatable-container">
                <div class="category-header" id="repeatable-header" title="Edit Repeatable Tasks"></div>
                <div class="task-list drop-zone" id="repeatable_tasks"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, onSnapshot, updateDoc, setDoc, doc, deleteDoc, serverTimestamp, writeBatch, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app", 
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        });
        
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const tasksRef = collection(db, "command_board_tasks");
        const categoriesRef = collection(db, "command_board_categories"); 

        let currentTasks = {};
        let currentCategories = {};
        let currentDragSourceCategory = ''; 
        let currentEditingCatId = null; 
        let currentEditingTaskId = null;

        signInAnonymously(auth).then(() => {
            onSnapshot(categoriesRef, (snapshot) => {
                currentCategories = {};
                snapshot.forEach(doc => { currentCategories[doc.id] = doc.data(); });
                renderBoard();
            }, (error) => console.error("Category Error: ", error));

            onSnapshot(tasksRef, (snapshot) => {
                currentTasks = {};
                snapshot.forEach(doc => { currentTasks[doc.id] = doc.data(); });
                renderBoard();
            }, (error) => console.error("Task Error: ", error));
        }).catch((error) => {
            console.error("Auth Failed:", error);
            alert("Database connection requires authentication.");
        });

        const newCatFile = document.getElementById('new-category-file');
        const newCatLabel = document.getElementById('new-category-file-label');
        newCatFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                newCatLabel.textContent = e.target.files[0].name;
                newCatLabel.classList.add('has-file');
            } else {
                newCatLabel.textContent = "Choose Icon...";
                newCatLabel.classList.remove('has-file');
            }
        });

        const modalCatFile = document.getElementById('modal-cat-file');
        const modalCatLabel = document.getElementById('modal-cat-file-label');
        modalCatFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                modalCatLabel.textContent = e.target.files[0].name;
                modalCatLabel.classList.add('has-file');
            } else {
                modalCatLabel.textContent = "Upload New Icon (Optional)";
                modalCatLabel.classList.remove('has-file');
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 100;
                        canvas.height = 100;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, 100, 100);
                        ctx.drawImage(img, 0, 0, 100, 100);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        function renderBoard() {
            const mainBoard = document.getElementById('main-board');
            const intakeZone = document.getElementById('intake-container');
            const repeatZone = document.getElementById('repeatable_tasks');
            const repeatHeader = document.getElementById('repeatable-header');
            const completedListModal = document.getElementById('completed-modal-list');
            
            Array.from(mainBoard.children).forEach(child => {
                if (child.id !== 'repeatable-container') {
                    mainBoard.removeChild(child);
                }
            });
            
            intakeZone.innerHTML = '';
            repeatZone.innerHTML = '';
            completedListModal.innerHTML = ''; 

            const intakeTasks = Object.entries(currentTasks).filter(([id, t]) => t.category === 'intake');
            if (intakeTasks.length === 0) {
                intakeZone.style.display = 'none';
            } else {
                intakeZone.style.display = 'flex';
            }

            const repeatCat = currentCategories['repeatable_tasks'] || { name: 'Repeatable Tasks', imageUrl: '' };
            const safeRepeatImage = repeatCat.imageUrl || '';
            const repeatName = repeatCat.name || 'Repeatable Tasks';
            
            if (safeRepeatImage) {
                repeatHeader.innerHTML = `<img src="${safeRepeatImage}" alt="Repeatable Tasks" class="category-image"><span class="category-title">${repeatName}</span>`;
            } else {
                repeatHeader.innerHTML = `<div class="fallback-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></div><span class="category-title">${repeatName}</span>`;
            }
            repeatHeader.onclick = () => openCategoryModal('repeatable_tasks', repeatName, safeRepeatImage);

            const sortedCategories = Object.entries(currentCategories)
                .filter(([id]) => id !== 'repeatable_tasks' && id !== 'completed_tasks')
                .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));

            sortedCategories.forEach(([catId, cat]) => {
                const catBox = document.createElement('div');
                catBox.className = 'category-box';
                
                const safeName = (cat.name || 'Unnamed').replace(/'/g, "\\'");
                const safeImage = cat.imageUrl || '';
                
                const headerContent = safeImage && safeImage.trim() !== "" 
                    ? `<img src="${safeImage}" alt="${safeName}" class="category-image">` 
                    : `<div class="fallback-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg></div>`;

                catBox.innerHTML = `
                    <div class="category-header" onclick="openCategoryModal('${catId}', '${safeName}', '${safeImage}')" title="${cat.name}">
                        ${headerContent}
                        <span class="category-title">${safeName}</span>
                    </div>
                    <div class="task-list drop-zone" id="${catId}"></div>
                `;
                mainBoard.appendChild(catBox);
            });

            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault(); 
                    const glowColor = zone.id === 'repeatable_tasks' ? '#ffcc80' : 
                                      zone.id === 'completed_tasks' ? '#4caf50' : 'var(--accent)';
                    
                    if(zone.tagName === 'BUTTON') {
                        zone.style.boxShadow = `0 0 0 2px ${glowColor}, var(--shadow-sm)`;
                    } else if (zone.id === 'intake-container') {
                        zone.style.boxShadow = `0 0 0 2px ${glowColor}, var(--shadow-sm)`;
                    } else {
                        zone.parentElement.style.boxShadow = `0 0 0 2px ${glowColor}, var(--shadow-sm)`;
                    }
                });
                
                zone.addEventListener('dragleave', () => {
                    if(zone.tagName === 'BUTTON' || zone.id === 'intake-container') {
                        zone.style.boxShadow = 'var(--shadow-sm)';
                    } else {
                        zone.parentElement.style.boxShadow = 'var(--shadow-sm)';
                    }
                });
                
                zone.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    if(zone.tagName === 'BUTTON' || zone.id === 'intake-container') {
                        zone.style.boxShadow = 'var(--shadow-sm)';
                    } else {
                        zone.parentElement.style.boxShadow = 'var(--shadow-sm)';
                    }
                    
                    const taskId = e.dataTransfer.getData('text/plain');
                    const targetCategory = zone.id === 'intake-container' ? 'intake' : zone.id;
                    const draggedTask = currentTasks[taskId];

                    if (!draggedTask) return;

                    if (currentDragSourceCategory === 'repeatable_tasks' && targetCategory !== 'repeatable_tasks') {
                         try { 
                            let newData = { text: draggedTask.text, category: targetCategory, createdAt: serverTimestamp() };
                            if (targetCategory === 'completed_tasks' && !draggedTask.completedDate) {
                                newData.completedDate = new Date().toISOString().split('T')[0];
                            }
                            await addDoc(tasksRef, newData);
                         } catch (error) { alert("FIREBASE ERROR: " + error.message); }
                    } 
                    else {
                        if (draggedTask.category !== targetCategory) {
                             try { 
                                 let updates = { category: targetCategory };
                                 if (targetCategory === 'completed_tasks' && !draggedTask.completedDate) {
                                     updates.completedDate = new Date().toISOString().split('T')[0];
                                 }
                                 await updateDoc(doc(db, "command_board_tasks", taskId), updates); 
                             } 
                             catch (error) { alert("FIREBASE ERROR: " + error.message); }
                        }
                    }
                });
            });

            const sortedTasks = Object.entries(currentTasks).sort((a, b) => {
                return (a[1].text || '').localeCompare(b[1].text || '');
            });

            sortedTasks.forEach(([taskId, task]) => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.draggable = true;
                card.id = taskId;
                
                if (task.category === 'completed_tasks') {
                    card.classList.add('task-completed');
                    const dateDisplay = task.completedDate ? `<span class="task-date">${task.completedDate}</span>` : '';
                    card.innerHTML = `<span>${task.text}</span>${dateDisplay}`;
                } else {
                    if(task.category === 'intake') { card.style.borderLeft = '3px solid var(--text-secondary)'; }
                    else if(task.category === 'repeatable_tasks') { card.style.borderLeft = '3px solid #ff9800'; }
                    else { card.style.borderLeft = '3px solid var(--accent)'; }
                    card.innerHTML = `<span>${task.text}</span>`;
                }
                
                card.addEventListener('click', () => { openTaskModal(taskId, task.text, task.completedDate, task.category); });

                card.addEventListener('dragstart', (e) => {
                    currentDragSourceCategory = task.category; 
                    e.dataTransfer.setData('text/plain', taskId);
                    setTimeout(() => card.style.opacity = '0.4', 0);
                });
                card.addEventListener('dragend', () => card.style.opacity = '1');

                if (task.category === 'completed_tasks') {
                    completedListModal.appendChild(card);
                } else {
                    let dropZone = document.getElementById(task.category);
                    if (!dropZone && task.category === 'intake') dropZone = intakeZone;
                    if (dropZone) dropZone.appendChild(card);
                }
            });
        }

        document.getElementById('add-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('new-task-input');
            if (input.value.trim() === '') return;
            const taskText = input.value;
            input.value = '';
            input.focus();
            try { await addDoc(tasksRef, { text: taskText, category: 'intake', createdAt: serverTimestamp() }); } 
            catch (error) { alert("FIREBASE ERROR: " + error.message); }
        });

        document.getElementById('add-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('add-category-btn');
            const nameInput = document.getElementById('new-category-name');
            const fileInput = document.getElementById('new-category-file');
            
            if (nameInput.value.trim() === '' || fileInput.files.length === 0) return;
            
            btn.textContent = "Processing...";
            btn.disabled = true;

            try {
                const file = fileInput.files[0];
                const base64Image = await fileToBase64(file);

                await addDoc(categoriesRef, { 
                    name: nameInput.value.trim(), 
                    imageUrl: base64Image,
                    createdAt: serverTimestamp() 
                });
                
                nameInput.value = '';
                fileInput.value = '';
                newCatLabel.textContent = "Choose Icon...";
                newCatLabel.classList.remove('has-file');
            } catch (error) { 
                alert("DATABASE ERROR: " + error.message); 
            } finally {
                btn.textContent = "Add Category";
                btn.disabled = false;
            }
        });

        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10); 
        }

        function hideModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 200);
        }

        document.getElementById('completed_tasks').addEventListener('click', () => {
            showModal('completed-modal');
        });

        window.closeCompletedModal = () => {
            hideModal('completed-modal');
        };

        document.getElementById('clear-all-completed-btn').addEventListener('click', async () => {
            if (confirm("Are you sure you want to permanently delete all completed tasks?")) {
                try {
                    const q = query(tasksRef, where("category", "==", "completed_tasks"));
                    const snapshot = await getDocs(q);
                    const batch = writeBatch(db);
                    snapshot.forEach((taskDoc) => { batch.delete(taskDoc.ref); });
                    await batch.commit();
                    closeCompletedModal();
                } catch (error) { 
                    alert("FIREBASE ERROR: " + error.message); 
                }
            }
        });

        window.openCategoryModal = (catId, currentName, currentImage) => {
            currentEditingCatId = catId;
            const nameInput = document.getElementById('modal-cat-name');
            
            nameInput.value = currentName;
            document.getElementById('modal-cat-existing-image').value = currentImage;
            
            modalCatFile.value = '';
            modalCatLabel.textContent = "Upload New Icon (Optional)";
            modalCatLabel.classList.remove('has-file');
            
            if (catId === 'repeatable_tasks') {
                nameInput.disabled = true;
                document.getElementById('modal-delete-btn').disabled = true;
            } else {
                nameInput.disabled = false;
                document.getElementById('modal-delete-btn').disabled = false;
            }

            showModal('category-modal');
        };

        window.closeCategoryModal = () => {
            hideModal('category-modal');
            currentEditingCatId = null;
        };

        document.getElementById('modal-save-btn').addEventListener('click', async () => {
            if (!currentEditingCatId) return;
            const btn = document.getElementById('modal-save-btn');
            const newName = document.getElementById('modal-cat-name').value.trim();
            const fileInput = document.getElementById('modal-cat-file');
            let finalImageUrl = document.getElementById('modal-cat-existing-image').value;
            
            btn.textContent = "Saving...";
            btn.disabled = true;

            try {
                if (fileInput.files.length > 0) {
                    finalImageUrl = await fileToBase64(fileInput.files[0]);
                }

                if (currentEditingCatId === 'repeatable_tasks') {
                    await setDoc(doc(db, "command_board_categories", "repeatable_tasks"), {
                        name: "Repeatable Tasks", imageUrl: finalImageUrl 
                    }, { merge: true });
                } else if (newName !== "") {
                    await updateDoc(doc(db, "command_board_categories", currentEditingCatId), { 
                        name: newName, imageUrl: finalImageUrl 
                    });
                }
                closeCategoryModal();
            } catch (error) { 
                alert("FIREBASE ERROR: " + error.message); 
            } finally {
                btn.textContent = "Save";
                btn.disabled = false;
            }
        });

        document.getElementById('modal-delete-btn').addEventListener('click', async () => {
            if (!currentEditingCatId || currentEditingCatId === 'repeatable_tasks') return;
            if (confirm("Delete this category? Tasks inside will return to the Intake bench.")) {
                try {
                    const q = query(tasksRef, where("category", "==", currentEditingCatId));
                    const snapshot = await getDocs(q);
                    const batch = writeBatch(db);
                    snapshot.forEach((taskDoc) => { batch.update(taskDoc.ref, { category: 'intake' }); });
                    await batch.commit();
                    await deleteDoc(doc(db, "command_board_categories", currentEditingCatId));
                    closeCategoryModal();
                } catch (error) { alert("FIREBASE ERROR: " + error.message); }
            }
        });

        const taskTextEnter = (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modal-task-save-btn').click(); }};
        document.getElementById('modal-task-text').addEventListener('keydown', taskTextEnter);
        document.getElementById('modal-task-date').addEventListener('keydown', taskTextEnter);

        window.openTaskModal = (taskId, text, date, category) => {
            currentEditingTaskId = taskId;
            document.getElementById('modal-task-text').value = text;
            
            const dateInput = document.getElementById('modal-task-date');
            if (category === 'completed_tasks') {
                dateInput.style.display = 'block';
                dateInput.value = date || '';
            } else {
                dateInput.style.display = 'none';
            }

            showModal('task-modal');
            document.getElementById('modal-task-text').focus();
        };

        window.closeTaskModal = () => {
            hideModal('task-modal');
            currentEditingTaskId = null;
        };

        document.getElementById('modal-task-save-btn').addEventListener('click', async () => {
            if (!currentEditingTaskId) return;
            const newText = document.getElementById('modal-task-text').value.trim();
            const dateInput = document.getElementById('modal-task-date');
            
            let updates = { text: newText };
            if (dateInput.style.display === 'block') {
                updates.completedDate = dateInput.value.trim();
            }

            if (newText !== "") {
                try {
                    await updateDoc(doc(db, "command_board_tasks", currentEditingTaskId), updates);
                    closeTaskModal();
                } catch (error) { alert("FIREBASE ERROR: " + error.message); }
            }
        });

        document.getElementById('modal-task-delete-btn').addEventListener('click', async () => {
            if (!currentEditingTaskId) return;
            try {
                await deleteDoc(doc(db, "command_board_tasks", currentEditingTaskId));
                closeTaskModal();
            } catch (error) { alert("FIREBASE ERROR: " + error.message); }
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            let exportData = "=== INTAKE BENCH ===\n";
            const intakeTasks = Object.values(currentTasks).filter(t => t.category === 'intake');
            if (intakeTasks.length === 0) exportData += "(Empty)\n";
            intakeTasks.sort((a,b) => (a.text || '').localeCompare(b.text || '')).forEach(t => exportData += `- ${t.text}\n`);
            exportData += "\n";

            const sortedCategories = Object.entries(currentCategories)
                .filter(([id]) => id !== 'repeatable_tasks' && id !== 'completed_tasks')
                .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));

            sortedCategories.forEach(([catId, cat]) => {
                exportData += `=== ${(cat.name || 'UNNAMED').toUpperCase()} ===\n`;
                const catTasks = Object.values(currentTasks).filter(t => t.category === catId);
                if (catTasks.length === 0) { exportData += "(Empty)\n"; } 
                else { 
                    catTasks.sort((a,b) => (a.text || '').localeCompare(b.text || '')).forEach(t => exportData += `- ${t.text}\n`); 
                }
                exportData += "\n";
            });

            exportData += "=== 📅 REPEATABLE TASKS ===\n";
            const repeatableTasks = Object.values(currentTasks).filter(t => t.category === 'repeatable_tasks');
            if (repeatableTasks.length === 0) exportData += "(Empty)\n";
            repeatableTasks.sort((a,b) => (a.text || '').localeCompare(b.text || '')).forEach(t => exportData += `- ${t.text}\n`);
            exportData += "\n";

            exportData += "=== ✔ COMPLETED TASKS ===\n";
            const completedTasks = Object.values(currentTasks).filter(t => t.category === 'completed_tasks');
            if (completedTasks.length === 0) exportData += "(Empty)\n";
            completedTasks.sort((a,b) => (a.text || '').localeCompare(b.text || '')).forEach(t => {
                const dateSuffix = t.completedDate ? ` [${t.completedDate}]` : '';
                exportData += `- ${t.text}${dateSuffix}\n`;
            });
            exportData += "\n";

            const blob = new Blob([exportData], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const dateStr = new Date().toISOString().split('T')[0];
            a.download = `Tasks_Export_${dateStr}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
