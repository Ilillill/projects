<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Board</title>
    <style>
        :root {
            /* Ultra-Modern Minimalist Theme */
            --bg-color: #ffffff; 
            --surface: #ffffff; 
            --input-bg: #f2f2f7; /* Apple-style soft input background */
            --border: #e5e5ea;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent: #ff9800; 
            --hover-bg: #fcfcfc;
            --drop-zone-bg: #ffffff; 
            --task-bg: #ffffff;
            --btn-blue: #007aff;
            --delete-btn-color: #ff3b30;
            
            /* Softer, more diffuse shadows for a "floating" feel */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-modal: 0 10px 40px rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 12px; 
            display: flex;
            flex-direction: column; 
            height: 100vh;
            box-sizing: border-box;
            gap: 16px; 
        }

        /* --- Streamlined Top Toolbar --- */
        #top-toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .toolbar-section {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 8px;
        }

        .text-input {
            padding: 8px 14px; 
            border-radius: 8px;
            border: 1px solid transparent;
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .text-input:focus {
            background: var(--surface);
            border: 1px solid var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.1);
        }
        
        button.action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px; 
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            white-space: nowrap;
        }
        
        button.action-btn:hover { opacity: 0.85; }
        button.action-btn:active { transform: scale(0.96); }
        
        .btn-export { background: var(--btn-blue) !important; }

        /* --- Main Board & Categories --- */
        #main-board {
            flex: 1;
            display: flex;
            flex-direction: column; 
            gap: 12px; 
            overflow-y: auto;
            padding-right: 4px; 
        }

        .category-box {
            background: var(--surface);
            border-radius: 12px;
            min-height: 60px; 
            display: flex;
            flex-direction: row; 
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        /* The new visual sidebar for images */
        .category-sidebar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px; /* Slightly wider to beautifully frame a square image */
            cursor: pointer;
            transition: background 0.2s;
            overflow: hidden; 
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            background: #fafafa;
            border-right: 1px solid var(--border);
        }

        .category-sidebar:hover { background: #f0f0f0; }

        /* Styling for the user-provided image path */
        .category-image {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: var(--shadow-sm);
        }

        /* Fallback text if no image is provided */
        .sidebar-title { 
            font-size: 0.7rem; 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            color: var(--text-secondary); 
            white-space: nowrap;
            transform: rotate(-90deg); 
        }

        .task-list {
            flex: 1;
            min-height: 40px; 
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap; 
            align-content: flex-start; 
            gap: 8px; 
            padding: 8px; 
            border-radius: 12px;
        }

        /* --- Super Minimal Task Cards --- */
        .task-card {
            background: var(--task-bg);
            padding: 6px 12px; 
            border-radius: 8px;
            cursor: pointer; 
            box-shadow: var(--shadow-sm);
            user-select: none;
            display: inline-flex; 
            align-items: center;
            width: fit-content; 
            max-width: 100%; 
            box-sizing: border-box;
            border: 1px solid var(--border); 
            transition: box-shadow 0.2s, transform 0.1s;
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .task-card span {
            word-break: break-word; 
            font-size: 0.85rem; 
            font-weight: 500;
        }

        .task-card:active { cursor: grabbing; opacity: 0.7; transform: scale(0.97); }

        /* Permanent Category overrides */
        #main-board .category-box:last-child .category-sidebar { background: #fff4e5; border-right: 1px solid #ffe0b2; }
        
        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px); /* Apple-like background blur */
            -webkit-backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; transition: opacity 0.2s;
        }
        
        .modal-box {
            background: var(--surface); padding: 24px; border-radius: 16px;
            width: 320px; box-shadow: var(--shadow-modal);
            border: 1px solid var(--border);
            transform: scale(0.95); transition: transform 0.2s;
        }
        
        .modal-overlay.active { opacity: 1; }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-box h3 { margin-top: 0; margin-bottom: 16px; font-size: 1.1rem; color: var(--text); font-weight: 600;}
        .modal-box input { width: 100%; box-sizing: border-box; margin-bottom: 12px; }
        .modal-btn-group { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        
        .btn-cancel { 
            background: var(--input-bg); color: var(--text); 
            border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        .btn-cancel:hover { background: #e5e5ea; }
        .btn-delete { 
            background: var(--delete-btn-color); color: #fff; 
            border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="category-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Manage Category</h3>
            <input type="text" id="modal-cat-name" class="text-input" placeholder="Category Name" autocomplete="off">
            <input type="text" id="modal-cat-image" class="text-input" placeholder="Image URL (Optional)" autocomplete="off">
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeCategoryModal()">Cancel</button>
                <button class="btn-delete" id="modal-delete-btn">Delete</button>
                <button class="action-btn" id="modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <div id="task-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Manage Task</h3>
            <input type="text" id="modal-task-text" class="text-input" autocomplete="off">
            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
                <button class="btn-delete" id="modal-task-delete-btn">Delete</button>
                <button class="action-btn" id="modal-task-save-btn">Save</button>
            </div>
        </div>
    </div>

    <div id="top-toolbar">
        <form id="add-task-form" class="toolbar-section">
            <input type="text" id="new-task-input" class="text-input" placeholder="Drop a thought here..." autocomplete="off" required style="width: 250px;">
            <button type="submit" class="action-btn">Add Task</button>
        </form>

        <div class="divider"></div>

        <form id="add-category-form" class="toolbar-section">
            <input type="text" id="new-category-name" class="text-input" placeholder="New Category" autocomplete="off" required style="width: 140px;">
            <input type="text" id="new-category-image" class="text-input" placeholder="Image URL (Opt)" autocomplete="off" style="width: 140px;">
            <button type="submit" class="action-btn">Add Cat</button>
        </form>

        <div style="flex-grow: 1;"></div> <button id="export-btn" class="action-btn btn-export">Export to TXT</button>
    </div>

    <div id="main-board">
        <div class="category-box">
            <div class="category-sidebar" style="cursor: default;" title="Intake Bench">
                <h2 class="sidebar-title">📥 INTAKE</h2>
            </div>
            <div class="task-list drop-zone" id="intake"></div>
        </div>

        <div class="category-box">
            <div class="category-sidebar" style="cursor: default;" title="Permanent Category">
                <h2 class="sidebar-title" style="color: #d84315;">📅 REPEAT</h2>
            </div>
            <div class="task-list drop-zone" id="repeatable_tasks"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, onSnapshot, updateDoc, doc, deleteDoc, serverTimestamp, writeBatch, query, where } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        });
        
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const tasksRef = collection(db, "command_board_tasks");
        const categoriesRef = collection(db, "command_board_categories"); 

        let currentTasks = {};
        let currentCategories = {};
        let currentDragSourceCategory = ''; 
        let currentEditingCatId = null; 
        let currentEditingTaskId = null;

        // Authenticate anonymously before listening to the database
        signInAnonymously(auth).then(() => {
            onSnapshot(categoriesRef, (snapshot) => {
                currentCategories = {};
                snapshot.forEach(doc => { currentCategories[doc.id] = doc.data(); });
                renderBoard();
            }, (error) => console.error("Category Error: ", error));

            onSnapshot(tasksRef, (snapshot) => {
                currentTasks = {};
                snapshot.forEach(doc => { currentTasks[doc.id] = doc.data(); });
                renderBoard();
            }, (error) => console.error("Task Error: ", error));
        }).catch((error) => {
            console.error("Auth Failed:", error);
            alert("Database connection requires authentication. Please check console.");
        });

        function renderBoard() {
            const mainBoard = document.getElementById('main-board');
            const intakeZone = document.getElementById('intake');
            const repeatZone = document.getElementById('repeatable_tasks');
            
            // Remove old dynamic categories (everything between Intake and Repeatable)
            Array.from(mainBoard.children).forEach(child => {
                if (child.querySelector('.drop-zone').id !== 'intake' && child.querySelector('.drop-zone').id !== 'repeatable_tasks') {
                    mainBoard.removeChild(child);
                }
            });
            
            intakeZone.innerHTML = '';
            repeatZone.innerHTML = '';

            // Sort and inject dynamic categories BEFORE the repeatable_tasks bench
            const sortedCategories = Object.entries(currentCategories).sort((a, b) => {
