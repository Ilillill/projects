<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Lessons</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root { --bg: #f9fafb; --sidebar: #2c3e50; --text: #333; --accent: #3498db; --success: #27ae60; --error: #e74c3c; --card-bg: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg); color: var(--text); }
        
        .sidebar { width: 250px; background: var(--sidebar); color: white; padding: 20px; overflow-y: auto; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        
        .lesson-item { padding: 12px; margin: 5px 0; background: rgba(255,255,255,0.05); cursor: pointer; border-radius: 6px; }
        .lesson-item.active { background: var(--accent); font-weight: bold; }
        
        .card { background: var(--card-bg); padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .lesson-title { margin-top: 0; font-size: 2em; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Exercises & Vocab Inputs */
        .test-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .test-q { width: 40%; font-weight: 500; }
        .test-input-group { width: 60%; display: flex; align-items: center; gap: 10px; }
        .test-input-group input { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 4px; font-size: 1em; outline: none; }
        .test-input-group input:focus { border-color: var(--accent); }
        .feedback { font-size: 0.9em; min-width: 180px; }
        .summary-box { margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px; font-weight: bold; display: none; }
        
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px;}
        
        #hw-editor-container { height: 200px; margin-bottom: 15px; background: white; }
        .teacher-feedback-box { background: #fffde7; border-left: 4px solid #f1c40f; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>Lessons</h2>
        <div id="lessonList">Loading...</div>
    </nav>

    <main class="main">
        <div id="welcomeScreen" class="card"><h2>Welcome</h2><p>Select a lesson from the menu to begin.</p></div>

        <div id="lessonContent" style="display: none;">
            <div class="card">
                <h1 id="displayTitle" class="lesson-title"></h1>
                <div id="displayBody" class="lesson-body"></div>
            </div>

            <div id="vocabContainer"></div>
            <div id="exerciseContainer"></div>

            <!-- HOMEWORK BOX -->
            <div class="card" id="homeworkContainer">
                <h2>Homework Submission</h2>
                <input type="text" id="studentNameInput" placeholder="Enter your name" style="padding: 10px; margin-bottom: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px;">
                <div id="hw-editor-container"></div>
                <button class="btn" onclick="submitHomework()" id="btnSubmitHw">Submit Homework</button>
                <div id="hwSaveStatus" style="color: var(--success); margin-top: 10px; display: none;">✅ Submitted successfully!</div>
                
                <div id="teacherFeedbackDisplay" style="display: none;" class="teacher-feedback-box">
                    <h4>Teacher's Feedback:</h4>
                    <div id="teacherFeedbackHTML"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        });
        const db = getFirestore(app);
        const auth = getAuth(app);

        let studentUid = null;
        let activeLessonId = null;
        let existingHwId = null;

        const hwQuill = new Quill('#hw-editor-container', { theme: 'snow', modules: { toolbar: [ ['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['clean'] ] } });

        signInAnonymously(auth).then((userCredential) => {
            studentUid = userCredential.user.uid;
            loadSidebarLessons();
        });

        async function loadSidebarLessons() {
            const listEl = document.getElementById('lessonList');
            listEl.innerHTML = '';
            // Alphabetical Order
            const q = query(collection(db, "lessons"), orderBy("title"));
            const snap = await getDocs(q);
            snap.forEach(docSnap => {
                const div = document.createElement('div');
                div.className = 'lesson-item';
                div.innerText = docSnap.data().title;
                div.onclick = () => {
                    document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    renderLesson(docSnap.id, docSnap.data());
                };
                listEl.appendChild(div);
            });
        }

        function renderLesson(lessonId, lessonData) {
            activeLessonId = lessonId;
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('lessonContent').style.display = 'block';
            document.getElementById('displayTitle').innerText = lessonData.title;
            document.getElementById('displayBody').innerHTML = lessonData.bodyHTML || ''; 
            
            loadResources(lessonId);
            loadHomework(lessonId);
        }

        async function loadHomework(lessonId) {
            existingHwId = null;
            hwQuill.root.innerHTML = '';
            document.getElementById('hwSaveStatus').style.display = 'none';
            document.getElementById('teacherFeedbackDisplay').style.display = 'none';

            // Find homework submitted by THIS specific anonymous user for THIS lesson
            const q = query(collection(db, "homework"), where("lessonId", "==", lessonId), where("studentId", "==", studentUid));
            const snap = await getDocs(q);
            
            if(!snap.empty) {
                const hwDoc = snap.docs[0];
                existingHwId = hwDoc.id;
                const data = hwDoc.data();
                hwQuill.root.innerHTML = data.contentHTML || '';
                if(data.studentName) document.getElementById('studentNameInput').value = data.studentName;
                
                if(data.feedbackHTML) {
                    document.getElementById('teacherFeedbackDisplay').style.display = 'block';
                    document.getElementById('teacherFeedbackHTML').innerHTML = data.feedbackHTML;
                }
            }
        }

        window.submitHomework = async () => {
            const btn = document.getElementById('btnSubmitHw');
            btn.innerText = "Saving...";
            const data = {
                lessonId: activeLessonId,
                studentId: studentUid,
                studentName: document.getElementById('studentNameInput').value || "Anonymous Student",
                contentHTML: hwQuill.root.innerHTML
            };

            if (existingHwId) {
                await updateDoc(doc(db, "homework", existingHwId), data);
            } else {
                const docRef = await addDoc(collection(db, "homework"), data);
                existingHwId = docRef.id;
            }
            btn.innerText = "Submit Homework";
            document.getElementById('hwSaveStatus').style.display = 'block';
        };

        // --- VOCAB & EXERCISES ---
        async function loadResources(lessonId) {
            const vContainer = document.getElementById('vocabContainer');
            const eContainer = document.getElementById('exerciseContainer');
            vContainer.innerHTML = ''; eContainer.innerHTML = '';

            const vSnap = await getDocs(query(collection(db, "vocabSets"), where("lessonId", "==", lessonId)));
            vSnap.forEach(doc => renderTestSet(doc.id, doc.data(), 'vocab'));

            const eSnap = await getDocs(query(collection(db, "exerciseSets"), where("lessonId", "==", lessonId)));
            eSnap.forEach(doc => renderTestSet(doc.id, doc.data(), 'exercise'));
        }

        function renderTestSet(setId, data, type) {
            if (!data.items || data.items.length === 0) return;
            let html = `<div class="card"><h2>${data.title}</h2><div id="form-${setId}">`;

            data.items.forEach((item, index) => {
                const question = type === 'vocab' ? item.english : item.question;
                const ans1 = type === 'vocab' ? item.spanish1 : item.answer;
                const ans2 = type === 'vocab' ? (item.spanish2 || "") : "";
                
                html += `
                <div class="test-row">
                    <div class="test-q">${question}</div>
                    <div class="test-input-group">
                        <input type="text" id="input-${setId}-${index}" class="student-input-${setId}" data-ans1="${ans1}" data-ans2="${ans2}" placeholder="Type Spanish here...">
                        <span class="feedback" id="feedback-${setId}-${index}"></span>
                    </div>
                </div>`;
            });

            html += `<button class="btn" onclick="window.checkAnswers('${setId}')">Check Answers</button>`;
            html += `<div id="summary-${setId}" class="summary-box"></div>`;
            html += `</div></div>`;
            
            if(type === 'vocab') document.getElementById('vocabContainer').innerHTML += html;
            else document.getElementById('exerciseContainer').innerHTML += html;
        }

        window.checkAnswers = (setId) => {
            const inputs = document.querySelectorAll(`.student-input-${setId}`);
            let correctCount = 0; let wrongCount = 0;
            
            inputs.forEach((input, index) => {
                const cleanText = (text) => (text || "").toLowerCase().trim().replace(/[.,!¡?¿]/g, "");
                const studentAns = cleanText(input.value);
                const ans1 = cleanText(input.getAttribute('data-ans1'));
                const ans2 = cleanText(input.getAttribute('data-ans2'));
                const feedbackSpan = document.getElementById(`feedback-${setId}-${index}`);
                
                if(studentAns === "") {
                    // Ignored empty string
                    input.style.borderColor = "#ddd";
                    input.style.backgroundColor = "white";
                    feedbackSpan.innerHTML = "";
                    return;
                }

                if (studentAns === ans1 || (ans2 !== "" && studentAns === ans2)) {
                    correctCount++;
                    input.style.borderColor = "var(--success)";
                    input.style.backgroundColor = "#f0fdf4";
                    feedbackSpan.style.color = "var(--success)";
                    feedbackSpan.innerHTML = "✅ Correct";
                } else {
                    wrongCount++;
                    input.style.borderColor = "var(--error)";
                    input.style.backgroundColor = "#fef2f2";
                    feedbackSpan.style.color = "var(--error)";
                    
                    const correctDisplay = ans2 ? `${input.getAttribute('data-ans1')} or ${input.getAttribute('data-ans2')}` : input.getAttribute('data-ans1');
                    feedbackSpan.innerHTML = `❌ <del style="color:#7f8c8d">${input.value}</del> <strong>${correctDisplay}</strong>`;
                }
            });

            const summary = document.getElementById(`summary-${setId}`);
            summary.style.display = 'block';
            summary.innerHTML = `Summary: ${correctCount} Correct, ${wrongCount} Wrong.`;
            if (wrongCount === 0 && correctCount > 0) summary.style.color = "var(--success)";
            else summary.style.color = "var(--text)";
        };
    </script>
</body>
</html>
