<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Lessons - Admin</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f4f9; --sidebar: #2c3e50; --text: #333; --accent: #27ae60;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg); }
        
        /* Layout */
        .sidebar { width: 250px; background: var(--sidebar); color: white; padding: 20px; overflow-y: auto; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        
        /* Elements */
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input[type="text"], textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: #e74c3c; }
        .lesson-item { padding: 10px; margin: 5px 0; background: rgba(255,255,255,0.1); cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between;}
        .lesson-item:hover { background: rgba(255,255,255,0.2); }
        
        /* Quill Editor Container */
        #editor-container { height: 200px; margin-bottom: 20px; background: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Spanish Lessons</h2>
        <button class="btn" id="btnNewLesson" style="width: 100%; margin-bottom: 15px;">+ Create New Lesson</button>
        <div id="lessonList">
            <div class="lesson-item">Loading...</div>
        </div>
    </div>

    <div class="main">
        <div class="card" id="editorCard" style="display: none;">
            <h2 id="formTitle">Edit Lesson</h2>
            
            <label>Lesson Title:</label>
            <input type="text" id="lessonTitle" placeholder="e.g., Lesson 1: El Reino Animal">
            
            <label>Teacher's Comments (Private Notes):</label>
            <textarea id="teacherComments" rows="3" placeholder="Notes regarding this lesson's progress or student focus areas..."></textarea>

            <label>Main Lesson Body:</label>
            <div id="editor-container"></div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn" id="btnSaveLesson">Save Lesson</button>
                <button class="btn btn-danger" id="btnDeleteLesson">Delete Lesson</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Initialize Rich Text Editor
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: { toolbar: [ ['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['clean'] ] }
        });

        // App State
        let currentLessonId = null;

        // --- DOM Elements ---
        const lessonListEl = document.getElementById('lessonList');
        const editorCard = document.getElementById('editorCard');
        const titleInput = document.getElementById('lessonTitle');
        const commentsInput = document.getElementById('teacherComments');

        // --- Functions ---
        async function loadLessons() {
            lessonListEl.innerHTML = '';
            const querySnapshot = await getDocs(collection(db, "lessons"));
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const div = document.createElement('div');
                div.className = 'lesson-item';
                div.innerHTML = `<span>${data.title}</span>`;
                div.onclick = () => openEditor(docSnap.id, data);
                lessonListEl.appendChild(div);
            });
        }

        function openEditor(id, data) {
            currentLessonId = id;
            editorCard.style.display = 'block';
            titleInput.value = data ? data.title : '';
            commentsInput.value = data ? data.teacherComments : '';
            quill.root.innerHTML = data ? data.bodyHTML : ''; // Load HTML into editor
            
            document.getElementById('formTitle').innerText = id ? "Edit Lesson" : "New Lesson";
            document.getElementById('btnDeleteLesson').style.display = id ? 'block' : 'none';
        }

        // --- Event Listeners ---
        document.getElementById('btnNewLesson').onclick = () => openEditor(null, null);

        document.getElementById('btnSaveLesson').onclick = async () => {
            const lessonData = {
                title: titleInput.value,
                teacherComments: commentsInput.value,
                bodyHTML: quill.root.innerHTML // Save the formatted HTML
            };

            if (currentLessonId) {
                await updateDoc(doc(db, "lessons", currentLessonId), lessonData);
                alert("Lesson Updated!");
            } else {
                await addDoc(collection(db, "lessons"), lessonData);
                alert("Lesson Created!");
            }
            loadLessons();
        };

        document.getElementById('btnDeleteLesson').onclick = async () => {
            if(confirm("Are you sure you want to delete this lesson?")) {
                await deleteDoc(doc(db, "lessons", currentLessonId));
                editorCard.style.display = 'none';
                loadLessons();
            }
        };

        // Init
        loadLessons();
    </script>
</body>
</html>
