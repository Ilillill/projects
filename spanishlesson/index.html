<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Lessons</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #f9fafb; --sidebar: #2c3e50; --text: #333; --accent: #3498db; --success: #27ae60; --error: #e74c3c; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--sidebar); color: white; padding: 20px; transition: all 0.3s; z-index: 1000; }
        .sidebar.collapsed { margin-left: -280px; }
        .sidebar h2 { cursor: pointer; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0; }
        
        .main { flex: 1; padding: 25px; overflow-y: auto; position: relative; }
        .menu-toggle { position: absolute; top: 15px; left: 15px; z-index: 1001; background: var(--sidebar); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; display: none; }
        
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .lesson-item { padding: 12px; margin: 5px 0; background: rgba(255,255,255,0.05); cursor: pointer; border-radius: 6px; }
        .lesson-item.active { background: var(--accent); font-weight: bold; }
        
        /* Interactive Elements */
        .test-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px dashed #eee; gap: 15px; }
        .test-input { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 5px; }
        .feedback { font-weight: bold; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { position: fixed; height: 100%; }
            .main { padding-top: 60px; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <nav class="sidebar" id="sidebar">
        <h2 onclick="loadHomePage()"><i class="fas fa-home"></i> Spanish Lessons</h2>
        <div id="lessonList">Loading...</div>
    </nav>

    <main class="main">
        <div id="contentArea">
            <div class="card">
                <h1 id="displayTitle" class="lesson-title">Home</h1>
                <div id="displayBody" class="lesson-body">Loading...</div>
            </div>

            <div id="resourceSection"></div>
            <div id="homeworkSection" class="card" style="display:none;">
                <h2>Homework Submission</h2>
                <input type="text" id="studentName" placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:10px;">
                <div id="hw-editor" style="height:200px;"></div>
                <button class="btn" onclick="submitHw()" style="margin-top:15px; background:var(--accent); color:white; padding:10px 20px; border:none; border-radius:5px;">Submit</button>
                <div id="teacherFeedback" style="display:none; background:#fffde7; padding:15px; margin-top:20px; border-left:4px solid #f1c40f;"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, getDoc, doc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc", authDomain: "tasks-de4d9.firebaseapp.com", projectId: "tasks-de4d9", appId: "1:908733856196:web:b8d268a692a0e079be4c91" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const hwQuill = new Quill('#hw-editor', { theme: 'snow' });

        signInAnonymously(auth).then(() => { loadSidebar(); loadHomePage(); });

        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('collapsed');

        async function loadSidebar() {
            const list = document.getElementById('lessonList'); list.innerHTML = '';
            const snap = await getDocs(query(collection(db, "lessons"), orderBy("title")));
            snap.forEach(d => {
                const div = document.createElement('div'); div.className = 'lesson-item'; div.innerText = d.data().title;
                div.onclick = () => { 
                    if(window.innerWidth < 768) toggleSidebar(); 
                    renderLesson(d.id, d.data()); 
                };
                list.appendChild(div);
            });
        }

        window.loadHomePage = async () => {
            document.getElementById('displayTitle').innerText = "Home Resources";
            document.getElementById('resourceSection').innerHTML = '';
            document.getElementById('homeworkSection').style.display = 'none';
            const d = await getDoc(doc(db, "pages", "home"));
            document.getElementById('displayBody').innerHTML = d.exists() ? d.data().bodyHTML : 'No resources yet.';
        };

        function renderLesson(id, data) {
            document.getElementById('displayTitle').innerText = data.title;
            document.getElementById('displayBody').innerHTML = data.bodyHTML || '';
            document.getElementById('homeworkSection').style.display = 'block';
            // Logic to load Vocab/Ex/Hw feedback would go here...
        }
    </script>
</body>
</html>
