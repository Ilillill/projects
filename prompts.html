<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate AI Prompt Builder</title>
    <style>
        :root {
            /* Minimalist Light Theme */
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --group-bg: transparent;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --tag-bg: #f3f4f6;
            --tag-hover: #e5e7eb;
            --tag-active: #3b82f6;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 200px; 
            line-height: 1.4;
        }

        /* Streamlined Top Bar */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;
            width: 100%;
        }

        .header-left-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-flow { background-color: #10b981; color: white; }
        .btn-flow:hover { background-color: #059669; }
        .btn-heroine { background-color: #ec4899; color: white; }
        .btn-heroine:hover { background-color: #db2777; }
        .btn-paleo { background-color: #f59e0b; color: white; }
        .btn-paleo:hover { background-color: #d97706; }
        .btn-edit-mode { background-color: var(--warning-color); color: white; }
        .btn-cheatsheet { background-color: #6366f1; color: white; }

        .search-bar {
            width: 100%;
            max-width: 250px;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background-color: #f9fafb;
            color: var(--text-color);
            font-size: 0.85rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            outline: none;
        }
        .search-bar:focus { box-shadow: inset 0 1px 3px rgba(59, 130, 246, 0.3), 0 0 0 2px rgba(59, 130, 246, 0.2); }

        /* Views */
        #builder-view, #cheatsheet-view { display: block; }
        #cheatsheet-view { display: none; }

        .cheatsheet-container {
            width: 100%; height: 60vh; background-color: var(--card-bg);
            border: none; border-radius: 8px; padding: 15px; box-sizing: border-box;
            color: var(--text-color); font-family: monospace; font-size: 0.95rem;
            resize: vertical; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Macro-Group Styling */
        .macro-group {
            border-left: 4px solid var(--accent-color);
            padding: 5px 15px;
            margin-bottom: 25px;
        }

        .macro-title {
            font-size: 1rem; color: var(--text-color); margin-top: 0; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; font-weight: 600;
        }

        /* DYNAMIC GRID LAYOUT - Forces horizontal stretching */
        .builder-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
            align-items: start; /* Prevents cards from stretching vertically */
        }

        .category-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: none;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .category-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            font-weight: 600;
        }

        .copy-all-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            box-shadow: none;
            border-radius: 4px;
        }
        .copy-all-btn:hover { background-color: #f3f4f6; color: var(--accent-color); }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background-color: var(--tag-bg);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .tag:hover { background-color: var(--tag-hover); }
        .tag.hidden { display: none; }

        /* Truncate long text into single line */
        .tag-text {
            display: inline-block;
            max-width: 190px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Edit Mode Styles */
        .edit-controls { display: none; gap: 4px; }
        body.edit-mode .edit-controls { display: inline-flex; }
        body.edit-mode .copy-all-btn { display: none; }
        
        .icon-btn {
            background: none; border: none; padding: 0 4px; color: var(--text-muted);
            cursor: pointer; font-size: 0.9rem; box-shadow: none;
        }
        .icon-btn:hover { color: var(--text-color); }
        .icon-btn.edit:hover { color: #10b981; }
        .icon-btn.delete:hover { color: var(--danger-color); }

        .add-tag-btn {
            background-color: transparent; border: 1px dashed #d1d5db; color: var(--text-muted);
            width: 100%; margin-top: 8px; padding: 6px; display: none; box-shadow: none;
        }
        body.edit-mode .add-tag-btn { display: block; }
        .add-tag-btn:hover { border-color: var(--text-color); color: var(--text-color); }

        .add-cat-btn, .add-master-btn {
            display: none; margin-top: 10px; background: transparent;
            border: 1px dashed #d1d5db; color: var(--text-muted); box-shadow: none;
        }
        body.edit-mode .add-cat-btn { display: inline-block; }
        
        body.edit-mode .add-master-btn { 
            display: block; width: 100%; padding: 15px; font-size: 1rem; margin-top: 20px; 
        }
        .add-master-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* Output Panel */
        .output-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 15px;
            z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1600px;
            margin: 0 auto 10px auto;
            flex-wrap: nowrap;
            gap: 15px;
        }

        .custom-input-group {
            display: flex; gap: 5px; flex-grow: 1; max-width: 400px;
        }

        .custom-input-group input {
            flex-grow: 1; background-color: #f9fafb; border: none;
            color: var(--text-color); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); outline: none;
        }
        .custom-input-group input:focus { box-shadow: inset 0 1px 3px rgba(59, 130, 246, 0.3), 0 0 0 2px rgba(59, 130, 246, 0.2); }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn-add { background-color: #4b5563; color: white; }
        .btn-chaos { background-color: #ef4444; color: white; }
        .btn-random { background-color: #8b5cf6; color: white; }
        .btn-copy { background-color: var(--accent-color); color: white; }
        .btn-clear { background-color: transparent; color: var(--text-muted); box-shadow: none; padding: 6px; border-radius: 5px; border: 1px solid #e5e7eb;}
        .btn-clear:hover { background-color: #fee2e2; color: #ef4444; border-color: #fca5a5;}
        
        .copy-indicator { display: none; color: #10b981; font-size: 0.8rem; font-weight: 600; margin-left: 5px; }

        .staging-area {
            width: 100%; max-width: 1600px; min-height: 70px; max-height: 120px;
            overflow-y: auto; margin: 0 auto; background-color: #f9fafb;
            border-radius: 8px; padding: 10px; box-sizing: border-box; display: flex; 
            flex-wrap: wrap; gap: 6px; align-content: flex-start; box-shadow: inset 0 1px 4px rgba(0,0,0,0.05);
        }

        .active-tag {
            background-color: var(--tag-active); color: white; padding: 4px 8px;
            border-radius: 5px; font-size: 0.8rem; display: flex; align-items: center;
            gap: 6px; cursor: grab; user-select: none; max-width: 100%; box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .active-tag span {
            display: inline-block;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .active-tag.dragging { opacity: 0.4; }
        .active-tag .remove-btn { background: none; border: none; color: #bfdbfe; cursor: pointer; font-weight: bold; box-shadow: none; padding: 0;}
        .active-tag .remove-btn:hover { color: #fff; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    </style>
</head>
<body>

    <header>
        <div class="header-controls">
            <div class="header-left-btns">
                <button class="btn-flow" onclick="window.open('https://labs.google/fx/tools/flow', '_blank')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg> Google Flow
                </button>
                <button class="btn-cheatsheet" onclick="window.toggleCheatsheet()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Cheatsheets
                </button>
                <button class="btn-edit-mode" id="edit-toggle-btn" onclick="window.toggleEditMode()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Edit: OFF
                </button>
            </div>
            <input type="text" id="search" class="search-bar" placeholder="Search across all categories...">
        </div>
    </header>

    <div id="builder-view">
        <div id="main-container">Loading Database...</div>
        <button class="add-master-btn" onclick="window.addMasterGroup()">➕ Add New Master Category</button>
    </div>

    <div id="cheatsheet-view">
        <h2 class="macro-title"><span style="color:#6366f1">■</span> Cheatsheet Manager</h2>
        <textarea id="cheatsheet-content" class="cheatsheet-container" placeholder="Write your cheatsheets here..."></textarea>
        <button class="btn-copy" style="margin-top: 10px;" onclick="window.saveCheatsheet()">Save Cheatsheet</button>
        <span id="save-status" style="margin-left: 10px; color: var(--tag-active); display: none;">Saved!</span>
    </div>

    <div class="output-panel" id="output-panel">
        <div class="output-header">
            <div class="custom-input-group">
                <input type="text" id="custom-input" placeholder="Type custom detail here..." onkeypress="window.handleEnter(event)">
                <button class="btn-add" onclick="window.addCustomText()">Add</button>
            </div>
            <div class="btn-group">
                <span class="copy-indicator" id="auto-copy-indicator">Copied!</span>
                <button class="btn-heroine" id="btn-heroine-ui" onclick="window.generateAndCopyHeroine()">👸 Instant Heroine</button>
                <button class="btn-paleo" id="btn-paleo-ui" onclick="window.generateAndCopyPaleo()">🦖 Instant Paleo</button>
                <button class="btn-chaos" onclick="window.triggerChaos()" title="Randomly select conflicting items">🌪️ Chaos</button>
                <button class="btn-random" onclick="window.randomizePrompt()">🎲 Random</button>
                <button class="btn-clear" onclick="window.clearPrompt()" title="Clear All">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </div>
        <div class="staging-area" id="staging-area"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app); 

        let groupedData = {};
        let heroineData = {};
        let paleoData = {};
        let editMode = false;
        let isCheatsheetView = false;
        let autoCopyTimeout;
        
        const mainContainer = document.getElementById('main-container');
        const stagingArea = document.getElementById('staging-area');
        const searchInput = document.getElementById('search');

        const autoCopyObserver = new MutationObserver(() => {
            const tags = stagingArea.querySelectorAll('.active-tag span');
            if (tags.length === 0) return;
            const promptText = Array.from(tags).map(span => span.textContent).join(', ');
            navigator.clipboard.writeText(promptText).then(() => {
                const indicator = document.getElementById('auto-copy-indicator');
                indicator.style.display = 'inline-block';
                clearTimeout(autoCopyTimeout);
                autoCopyTimeout = setTimeout(() => { indicator.style.display = 'none'; }, 1000);
            }).catch(e => console.warn('Clipboard write ignored (document not focused)', e));
        });
        autoCopyObserver.observe(stagingArea, { childList: true });

        const defaultGroupedData = {
            "Core Settings & Styles": {
                color: "#6366f1",
                categories: {
                    "Common": ["close-up", "macro", "worm's-eye view", "underwater and overwater view", "pristine", "ultra-high-resolution", "hyper realistic", "digital art", "fantasy", "anime", "8k resolution", "soft golden hour", "god rays", "magical", "mysterious", "Gravity Falls", "Amphibia show", "Owls House", "World of Warcraft", "Lord of the Rings", "Gruncle Stan", "Mabel Pines", "Dipper Pines", "Anne Boonchuy", "Luz Noceda", "Eda Clawthorne", "Jaina Proudmoore", "Arthas Menethil", "Sylvanas Windrunner", "young woman", "frostfire mage", "beautiful", "gorgeous", "very cute", "long hair", "hair blue and orange", "no runes as decorations", "laughing", "smiling", "breathing underwater", "levitating", "Deinonychus", "Allosaurus", "Dilophosaurus", "Dimetrodon", "Gorgonops", "Dunkleosteus", "ancient forest", "frozen tundra", "blizzard and snowstorm", "misty moors", "rolling hills", "floating islands", "deciduous forest", "coniferous forest", "underwater", "beautiful wild beach", "idyllic magical lake", "mysterious magical swamp", "mangrove swamp"]
                }
            }
        };

        const defaultHeroineData = {
            base: "Ultra-high-resolution, beautiful, gorgeous, very cute young female, long hair",
            classes: ["frostfire mage", "druid"],
            styles: ["Fantasy style", "Anime"],
            cameras: ["face close up", "worm's-eye view"],
            clothes: ["2 part swimming suit", "Airship captain uniform"],
            actions: ["She is sitting in a shallow water", "She is casting a spell"],
            environments: ["Floating islands", "Crystal cave"]
        };

        const defaultPaleoData = {
            base: "Ultra-high-resolution, photorealistic, scientifically accurate paleoart",
            species: ["Tyrannosaurus rex", "Velociraptor"],
            styles: ["photorealistic cinematic photograph", "shot on 35mm lens"],
            cameras: ["face close-up", "extreme macro close-up of scales"],
            actions: ["stalking prey through tall grass", "roaring fiercely"],
            environments: ["dense ancient redwood forest", "tropical prehistoric jungle"]
        };
        
        signInAnonymously(auth).then(() => {
            get(ref(db, 'promptBuilder/groupedData')).then((snapshot) => {
                if (!snapshot.exists()) {
                    set(ref(db, 'promptBuilder/groupedData'), defaultGroupedData);
                    set(ref(db, 'promptBuilder/heroineData'), defaultHeroineData);
                    set(ref(db, 'promptBuilder/paleoData'), defaultPaleoData);
                    set(ref(db, 'cheatsheets/content'), "Your cheatsheets live here. Safe and synced.");
                }
            }).catch((error) => console.error("Initialization Error:", error));

            onValue(ref(db, 'promptBuilder/groupedData'), (snapshot) => {
                groupedData = snapshot.val() || {};
                
                let needsUpdate = false;
                if (!groupedData['Uncategorized - Rescued']) {
                    groupedData['Uncategorized - Rescued'] = { color: "#9ca3af", categories: { "Orphaned Tags": [] } };
                    needsUpdate = true;
                }

                if (!groupedData['Custom Collections'] && !groupedData['_patchedCustom']) {
                    const newData = {};
                    for (let key in groupedData) {
                        if (key === 'Actions & Behaviors') {
                            newData['Custom Collections'] = { color: "#eab308", categories: { "My First Custom Set": ["Add your own phrases here!"] } };
                        }
                        newData[key] = groupedData[key];
                    }
                    newData['_patchedCustom'] = true;
                    groupedData = newData;
                    needsUpdate = true;
                }

                if (needsUpdate) {
                    set(ref(db, 'promptBuilder/groupedData'), groupedData);
                } else {
                    const renderData = {...groupedData};
                    delete renderData['_patchedCustom'];
                    renderBuilder(renderData);
                }
            }, (error) => {
                mainContainer.innerHTML = `<h3 style="color: #ef4444;">Permission Error: ${error.message}</h3>`;
            });

            onValue(ref(db, 'promptBuilder/heroineData'), (snapshot) => { heroineData = snapshot.val() || defaultHeroineData; });
            onValue(ref(db, 'promptBuilder/paleoData'), (snapshot) => { paleoData = snapshot.val() || defaultPaleoData; });
            onValue(ref(db, 'cheatsheets/content'), (snapshot) => {
                document.getElementById('cheatsheet-content').value = snapshot.val() || "";
            });
            
        }).catch((error) => {
            mainContainer.innerHTML = `<h3 style="color: #ef4444;">Login Error: ${error.message}</h3>`;
        });

        function renderBuilder(dataToRender) {
            mainContainer.innerHTML = '';
            for (const [groupName, groupData] of Object.entries(dataToRender)) {
                if(!groupData.categories) groupData.categories = {};
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'macro-group';
                groupDiv.style.borderLeftColor = groupData.color || '#3b82f6';

                const groupTitle = document.createElement('h2');
                groupTitle.className = 'macro-title';
                groupTitle.innerHTML = `<span style="color:${groupData.color || '#3b82f6'}">■</span> ${groupName}`;
                
                const groupEditSpan = document.createElement('span');
                groupEditSpan.className = 'edit-controls';
                groupEditSpan.innerHTML = `
                    <button class="icon-btn edit" title="Rename Group" onclick="window.editGroup('${groupName}')">✎</button>
                    <button class="icon-btn delete" title="Delete Group" onclick="window.deleteGroup('${groupName}')">🗑</button>
                `;
                if(groupName !== 'Uncategorized - Rescued') groupTitle.appendChild(groupEditSpan);
                groupDiv.appendChild(groupTitle);

                const gridContainer = document.createElement('div');
                gridContainer.className = 'builder-container';

                for (const [category, items] of Object.entries(groupData.categories)) {
                    const safeItems = items || [];
                    const card = document.createElement('div');
                    card.className = 'category-card';

                    const header = document.createElement('div');
                    header.className = 'category-header';
                    
                    const title = document.createElement('h3');
                    title.className = 'category-title';
                    title.textContent = category;

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-all-btn';
                    copyBtn.title = "Copy Category";
                    copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(safeItems.join(', ')).then(() => {
                            const originalHTML = copyBtn.innerHTML;
                            copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                            setTimeout(() => copyBtn.innerHTML = originalHTML, 1500);
                        });
                    };

                    const catEditSpan = document.createElement('span');
                    catEditSpan.className = 'edit-controls';
                    catEditSpan.innerHTML = `
                        <button class="icon-btn edit" title="Rename Category" onclick="window.editCategory('${groupName}', '${category}')">✎</button>
                        <button class="icon-btn delete" title="Delete Category" onclick="window.deleteCategory('${groupName}', '${category}')">🗑</button>
                    `;

                    header.appendChild(title);
                    header.appendChild(catEditSpan);
                    header.appendChild(copyBtn);
                    card.appendChild(header);

                    const tagContainer = document.createElement('div');
                    tagContainer.className = 'tag-container';

                    safeItems.forEach((item, index) => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.innerHTML = `<span class="tag-text" title="${item.replace(/"/g, '&quot;')}">${item}</span>`;
                        tag.dataset.text = item.toLowerCase();
                        
                        const tagEditSpan = document.createElement('span');
                        tagEditSpan.className = 'edit-controls';
                        tagEditSpan.innerHTML = `
                            <button class="icon-btn delete" onclick="event.stopPropagation(); window.deleteTag('${groupName}', '${category}', ${index})">&times;</button>
                        `;
                        tag.appendChild(tagEditSpan);
                        
                        tag.addEventListener('click', (e) => {
                            if(editMode && e.target.tagName !== 'BUTTON') {
                                window.editTag(groupName, category, index, item);
                                return;
                            }
                            if(!editMode) {
                                window.createActiveTag(item);
                                tag.style.backgroundColor = groupData.color || "var(--accent-color)";
                                tag.style.color = "white";
                                setTimeout(() => {
                                    tag.style.backgroundColor = ""; tag.style.color = "";
                                }, 200);
                            }
                        });
                        tagContainer.appendChild(tag);
                    });

                    card.appendChild(tagContainer);

                    const addTagBtn = document.createElement('button');
                    addTagBtn.className = 'add-tag-btn';
                    addTagBtn.textContent = '+ Add Phrase';
                    addTagBtn.onclick = () => window.addTag(groupName, category);
                    card.appendChild(addTagBtn);

                    gridContainer.appendChild(card);
                }

                const addCatBtn = document.createElement('button');
                addCatBtn.className = 'add-cat-btn';
                addCatBtn.textContent = '+ Add Category to ' + groupName;
                addCatBtn.onclick = () => window.addCategory(groupName);

                groupDiv.appendChild(gridContainer);
                groupDiv.appendChild(addCatBtn);
                mainContainer.appendChild(groupDiv);
            }
        }
        
        window.toggleEditMode = () => {
            editMode = !editMode;
            document.body.classList.toggle('edit-mode', editMode);
            const btn = document.getElementById('edit-toggle-btn');
            btn.innerHTML = editMode ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Edit: ON` : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Edit: OFF`;
            btn.style.backgroundColor = editMode ? '#ef4444' : 'var(--warning-color)';
        };

        window.toggleCheatsheet = () => {
            isCheatsheetView = !isCheatsheetView;
            document.getElementById('builder-view').style.display = isCheatsheetView ? 'none' : 'block';
            document.getElementById('output-panel').style.display = isCheatsheetView ? 'none' : 'block';
            document.getElementById('cheatsheet-view').style.display = isCheatsheetView ? 'block' : 'none';
            const btn = document.querySelector('.btn-cheatsheet');
            btn.innerHTML = isCheatsheetView ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Builder` : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Cheatsheets`;
        };

        window.saveCheatsheet = () => {
            const content = document.getElementById('cheatsheet-content').value;
            set(ref(db, 'cheatsheets/content'), content).then(() => {
                const status = document.getElementById('save-status');
                status.style.display = 'inline';
                setTimeout(() => status.style.display = 'none', 2000);
            });
        };

        window.addMasterGroup = () => {
            const name = prompt("Enter new Master Category name:");
            if(name && name.trim()) {
                const safeName = name.trim();
                if(!groupedData[safeName]) {
                    const randomColor = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                    groupedData[safeName] = { color: randomColor, categories: { "New Category": ["Placeholder Phrase"] } };
                    set(ref(db, 'promptBuilder/groupedData'), groupedData);
                }
            }
        };

        window.editGroup = (oldName) => {
            const newName = prompt("Rename master category:", oldName);
            if(newName && newName.trim() && newName !== oldName) {
                const safeNewName = newName.trim();
                const newData = {};
                for (let key in groupedData) {
                    if (key === oldName) newData[safeNewName] = groupedData[oldName];
                    else newData[key] = groupedData[key];
                }
                groupedData = newData;
                set(ref(db, 'promptBuilder/groupedData'), groupedData);
            }
        };

        window.editCategory = (group, oldCategory) => {
            const newCategory = prompt("Rename category:", oldCategory);
            if(newCategory && newCategory.trim() && newCategory !== oldCategory) {
                groupedData[group].categories[newCategory.trim()] = groupedData[group].categories[oldCategory];
                delete groupedData[group].categories[oldCategory];
                set(ref(db, 'promptBuilder/groupedData'), groupedData);
            }
        };

        window.addTag = (group, category) => {
            const text = prompt("Enter new phrase:");
            if(text && text.trim()) {
                if(!groupedData[group].categories[category]) groupedData[group].categories[category] = [];
                groupedData[group].categories[category].push(text.trim());
                set(ref(db, 'promptBuilder/groupedData'), groupedData);
            }
        };

        window.editTag = (group, category, index, oldText) => {
            const text = prompt("Edit phrase:", oldText);
            if(text && text.trim()) {
                groupedData[group].categories[category][index] = text.trim();
                set(ref(db, 'promptBuilder/groupedData'), groupedData);
            }
        };

        window.deleteTag = (group, category, index) => {
            groupedData[group].categories[category].splice(index, 1);
            set(ref(db, 'promptBuilder/groupedData'), groupedData);
        };

        window.addCategory = (group) => {
            const name = prompt("Enter new category name:");
            if(name && name.trim()) {
                if(!groupedData[group].categories) groupedData[group].categories = {};
                groupedData[group].categories[name.trim()] = ["Placeholder Phrase"];
                set(ref(db, 'promptBuilder/groupedData'), groupedData);
            }
        };

        window.deleteCategory = (group, category) => {
            if(confirm(`Delete category "${category}"? \nAll tags inside will be rescued to 'Uncategorized'.`)) {
                const orphanedTags = groupedData[group].categories[category] || [];
                if(orphanedTags.length > 0) {
                    if(!groupedData['Uncategorized - Rescued'].categories["Orphaned Tags"]) groupedData['Uncategorized - Rescued'].categories["Orphaned Tags"] = [];
                    groupedData['Uncategorized - Rescued'].categories["Orphaned Tags"].push(...orphanedTags);
                }
                delete groupedData[group].categories[category];
                set(ref(db, 'promptBuilder/groupedData'), groupedData);
            }
        };

        window.deleteGroup = (group) => {
            if(confirm(`Delete entire group "${group}" and rescue ALL tags inside?`)) {
                let allTags = [];
                for(let cat in groupedData[group].categories) {
                    allTags = allTags.concat(groupedData[group].categories[cat] || []);
                }
                if(allTags.length > 0) {
                    if(!groupedData['Uncategorized - Rescued'].categories["Orphaned Tags"]) groupedData['Uncategorized - Rescued'].categories["Orphaned Tags"] = [];
                    groupedData['Uncategorized - Rescued'].categories["Orphaned Tags"].push(...allTags);
                }
                delete groupedData[group];
                set(ref(db, 'promptBuilder/groupedData'), groupedData);
            }
        };

        window.handleEnter = (e) => { if (e.key === 'Enter') window.addCustomText(); };

        window.addCustomText = () => {
            const input = document.getElementById('custom-input');
            const text = input.value.trim();
            if (text) {
                window.createActiveTag(text);
                input.value = '';
            }
        };

        window.createActiveTag = (text) => {
            const tag = document.createElement('div');
            tag.className = 'active-tag';
            tag.draggable = true;
            tag.title = text; 
            
            const textNode = document.createElement('span');
            textNode.textContent = text;
            tag.appendChild(textNode);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.innerHTML = '&times;';
            removeBtn.onclick = () => tag.remove(); 
            tag.appendChild(removeBtn);

            tag.addEventListener('dragstart', handleDragStart);
            tag.addEventListener('dragend', handleDragEnd);

            stagingArea.appendChild(tag);
        };

        window.clearPrompt = () => { stagingArea.innerHTML = ''; };

        function getAllItems() {
            let all = [];
            for (let g in groupedData) {
                if(g === '_patchedCustom') continue;
                for (let c in groupedData[g].categories) {
                    all = all.concat(groupedData[g].categories[c]);
                }
            }
            return all;
        }

        window.randomizePrompt = () => {
            window.clearPrompt();
            const all = getAllItems();
            if(all.length === 0) return;
            for(let i=0; i<8; i++) {
                window.createActiveTag(all[Math.floor(Math.random() * all.length)]);
            }
        };

        window.triggerChaos = () => {
            window.clearPrompt();
            const all = getAllItems();
            if(all.length === 0) return;
            const numItems = Math.floor(Math.random() * 13) + 3; 
            for(let i=0; i<numItems; i++) {
                window.createActiveTag(all[Math.floor(Math.random() * all.length)]);
            }
        };

        let dragSourceEl = null;
        function handleDragStart(e) {
            dragSourceEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
            setTimeout(() => this.classList.add('dragging'), 0);
        }
        function handleDragEnd(e) { this.classList.remove('dragging'); dragSourceEl = null; }

        stagingArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const dragging = document.querySelector('.dragging');
            if (!dragging) return;
            const afterElement = getDragAfterElement(stagingArea, e.clientX, e.clientY);
            if (afterElement == null) stagingArea.appendChild(dragging);
            else stagingArea.insertBefore(dragging, afterElement);
        });

        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.active-tag:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const centerX = box.left + box.width / 2;
                const centerY = box.top + box.height / 2;
                const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                if (distance < closest.distance) return { offset: distance, element: child };
                else return closest;
            }, { distance: Number.POSITIVE_INFINITY }).element;
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const groups = document.querySelectorAll('.macro-group');
            groups.forEach(group => {
                let groupHasMatch = false;
                const cards = group.querySelectorAll('.category-card');
                cards.forEach(card => {
                    let cardHasMatch = false;
                    const tags = card.querySelectorAll('.tag');
                    tags.forEach(tag => {
                        if (tag.dataset.text.includes(term)) {
                            tag.classList.remove('hidden');
                            cardHasMatch = true;
                            groupHasMatch = true;
                        } else {
                            tag.classList.add('hidden');
                        }
                    });
                    card.style.display = cardHasMatch || term === "" ? 'inline-block' : 'none';
                });
                group.style.display = groupHasMatch || term === "" ? 'block' : 'none';
            });
        });

        const pick = (arr) => arr && arr.length > 0 ? arr[Math.floor(Math.random() * arr.length)] : "";
        
        window.generateAndCopyHeroine = () => {
            const promptParts = [
                heroineData.base, pick(heroineData.classes), pick(heroineData.styles),
                pick(heroineData.cameras), pick(heroineData.clothes), pick(heroineData.actions), pick(heroineData.environments)
            ].filter(Boolean);
            
            const finalPrompt = promptParts.join(", ");
            navigator.clipboard.writeText(finalPrompt).then(() => {
                const btn = document.getElementById('btn-heroine-ui');
                const orig = btn.innerHTML;
                btn.innerHTML = "✨ Copied!";
                btn.style.backgroundColor = "#10b981";
                setTimeout(() => { btn.innerHTML = orig; btn.style.backgroundColor = ""; }, 1500);
            });
        };

        window.generateAndCopyPaleo = () => {
            const promptParts = [
                paleoData.base, pick(paleoData.species), pick(paleoData.styles),
                pick(paleoData.cameras), pick(paleoData.actions), pick(paleoData.environments)
            ].filter(Boolean);
            
            const finalPrompt = promptParts.join(", ");
            navigator.clipboard.writeText(finalPrompt).then(() => {
                const btn = document.getElementById('btn-paleo-ui');
                const orig = btn.innerHTML;
                btn.innerHTML = "✨ Copied!";
                btn.style.backgroundColor = "#10b981";
                setTimeout(() => { btn.innerHTML = orig; btn.style.backgroundColor = ""; }, 1500);
            });
        };

    </script>
</body>
</html>
