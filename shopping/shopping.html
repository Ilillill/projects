<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Speedy Shopper Matrix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --surface: #1e1e1e;
            --border: #333;
            --text: #e0e0e0;
            --accent: #ff9800; 
            --btn-active: #e68a00;
            --danger: #ff5252;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            gap: 12px;
        }

        h2 { margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        #top-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #custom-entry-form {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        #custom-input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #2d2d2d;
            color: var(--text);
            font-size: 0.9rem;
        }

        button {
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .submit-btn {
            background: var(--accent);
            color: #000;
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        .submit-btn:hover { background: var(--btn-active); }

        .manage-toggle-btn {
            background: #333;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.9rem;
            border: 1px solid #555;
            white-space: nowrap;
        }
        .manage-toggle-btn:hover { background: #444; }

        .board {
            flex: 1;
            display: flex;
            flex-direction: column; 
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .category-box {
            background: var(--surface);
            border-radius: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .category-box.drag-over {
            border-color: var(--accent);
            background-color: #2a2a2a;
        }

        .category-box h2 {
            font-size: 0.8rem; 
            flex: 0 0 130px; 
            padding-top: 6px;
            color: var(--text);
            font-weight: 600;
        }

        .item-grid {
            flex: 1 1 200px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 32px; 
        }

        /* Standard Shop Button */
        .shop-btn {
            background: #2d2d2d;
            border: 1px solid #444;
            color: var(--text);
            padding: 5px 10px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            user-select: none;
            cursor: grab;
        }
        .shop-btn:active { cursor: grabbing; }
        .shop-btn:hover { background: #3d3d3d; border-color: #666; }
        
        .shop-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
        }

        /* Manage Mode Inputs & Elements */
        .cat-manage-header {
            flex: 0 0 140px; 
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cat-manage-input {
            width: 100px;
            padding: 4px;
            background: #121212;
            border: 1px solid #555;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
        }

        .shop-btn.manage-mode {
            cursor: default;
            padding: 3px 6px 3px 10px;
        }
        .shop-btn.manage-mode:active { cursor: default; }
        
        .item-manage-input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.85rem;
            width: 90px;
            outline: none;
        }
        .item-manage-input:focus {
            border-bottom: 1px solid var(--accent);
        }

        .del-btn {
            background: none;
            color: var(--danger);
            border: none;
            padding: 2px 6px;
            font-size: 0.9rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .del-btn:hover {
            background: rgba(255, 82, 82, 0.2);
            transform: scale(1.1);
        }

        .add-cat-box {
            background: #1a1a1a;
            border: 1px dashed #555;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <div id="top-bar">
        <form id="custom-entry-form">
            <input type="text" id="custom-input" placeholder="Type new item..." autocomplete="off" required>
            <button type="submit" class="submit-btn">Add</button>
        </form>
        <button id="toggle-view-btn" class="manage-toggle-btn"><i class="fa-solid fa-gear"></i> Manage</button>
    </div>

    <div id="shop-board" class="board"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, setDoc, writeBatch, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const configRef = doc(db, "shopping_matrix_config", "categories");
        const inventoryRef = collection(db, "shopping_matrix_inventory");

        let state = {
            categories: [],
            items: [],
            isManageMode: false
        };

        function getSortedCategories() {
            let sortedCats = [...state.categories].sort((a, b) => a.localeCompare(b));
            const uncatIndex = sortedCats.indexOf("Uncategorized");
            if (uncatIndex > -1) {
                sortedCats.splice(uncatIndex, 1);
                sortedCats.unshift("Uncategorized");
            }
            return sortedCats;
        }

        function getSortedItems(itemsArray) {
            return [...itemsArray].sort((a, b) => a.name.localeCompare(b.name));
        }

        const defaultCategories = ["🍏 Produce", "🥩 Meat & Fish", "🥛 Dairy & Chilled", "🍞 Bakery & Breakfast", "🍕 Meals & Pantry", "🥤 Drinks", "🍫 Sweets & Snacks", "🧼 Household & Pets", "Uncategorized"];
        const defaultItems = [
            { name: "Apples", cat: "🍏 Produce" }, { name: "Bananas", cat: "🍏 Produce" },
            { name: "Chicken breasts", cat: "🥩 Meat & Fish" }, { name: "Milk", cat: "🥛 Dairy & Chilled" }
            // Truncated for brevity, rest of your items will load or seed fine
        ];

        async function seedDatabase() {
            const invSnap = await getDocs(inventoryRef);
            if (invSnap.empty) {
                await setDoc(configRef, { list: defaultCategories });
                const batch = writeBatch(db);
                defaultItems.forEach(item => {
                    const newDocRef = doc(inventoryRef);
                    batch.set(newDocRef, { name: item.name, category: item.cat, isActive: false });
                });
                await batch.commit();
            }
        }

        signInAnonymously(auth).then(() => {
            seedDatabase();
            onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists()) state.categories = docSnap.data().list || [];
                renderShopBoard();
            });
            onSnapshot(inventoryRef, (snapshot) => {
                state.items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderShopBoard();
            });
        }).catch((error) => console.error("Silent login failed:", error));

        function renderShopBoard() {
            const board = document.getElementById('shop-board');
            board.innerHTML = '';

            const displayCategories = getSortedCategories();

            displayCategories.forEach(catName => {
                let catItems = state.items.filter(i => i.category === catName);
                catItems = getSortedItems(catItems); 
                
                // Hide empty Uncategorized in normal mode
                if (!state.isManageMode && catName === "Uncategorized" && catItems.length === 0) return;

                const box = document.createElement('div');
                box.className = 'category-box';
                
                // Allow Drag & Drop only in Normal Mode
                if (!state.isManageMode) {
                    box.addEventListener('dragover', (e) => {
                        e.preventDefault(); 
                        box.classList.add('drag-over');
                    });
                    box.addEventListener('dragleave', () => box.classList.remove('drag-over'));
                    box.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        box.classList.remove('drag-over');
                        const itemId = e.dataTransfer.getData('text/plain');
                        if (itemId) await updateDoc(doc(db, "shopping_matrix_inventory", itemId), { category: catName });
                    });
                }

                // --- CATEGORY HEADER ---
                if (state.isManageMode) {
                    const headerWrap = document.createElement('div');
                    headerWrap.className = 'cat-manage-header';

                    const input = document.createElement('input');
                    input.className = 'cat-manage-input';
                    input.value = catName;
                    
                    input.onblur = async () => {
                        const newName = input.value.trim();
                        if (newName && newName !== catName) {
                            const newCats = state.categories.map(c => c === catName ? newName : c);
                            await setDoc(configRef, { list: newCats });
                            
                            const batch = writeBatch(db);
                            state.items.filter(i => i.category === catName).forEach(item => {
                                batch.update(doc(db, "shopping_matrix_inventory", item.id), { category: newName });
                            });
                            await batch.commit();
                        } else {
                            input.value = catName; // Reset if blank
                        }
                    };
                    headerWrap.appendChild(input);

                    if (catName !== "Uncategorized") {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'del-btn';
                        delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        delBtn.onclick = async () => {
                            if (confirm(`Delete category "${catName}"? Items will become Uncategorized.`)) {
                                const newCats = state.categories.filter(c => c !== catName);
                                if (!newCats.includes("Uncategorized")) newCats.push("Uncategorized");
                                await setDoc(configRef, { list: newCats });
                                
                                const batch = writeBatch(db);
                                state.items.filter(i => i.category === catName).forEach(item => {
                                    batch.update(doc(db, "shopping_matrix_inventory", item.id), { category: "Uncategorized" });
                                });
                                await batch.commit();
                            }
                        };
                        headerWrap.appendChild(delBtn);
                    }
                    box.appendChild(headerWrap);
                } else {
                    const title = document.createElement('h2');
                    title.textContent = catName;
                    box.appendChild(title);
                }

                // --- ITEMS GRID ---
                const grid = document.createElement('div');
                grid.className = 'item-grid';

                catItems.forEach(item => {
                    const btn = document.createElement('div');
                    
                    if (state.isManageMode) {
                        btn.className = 'shop-btn manage-mode';
                        
                        const input = document.createElement('input');
                        input.className = 'item-manage-input';
                        input.value = item.name;
                        input.onblur = async () => {
                            const newName = input.value.trim();
                            if (newName && newName !== item.name) {
                                await updateDoc(doc(db, "shopping_matrix_inventory", item.id), { name: newName });
                            } else {
                                input.value = item.name;
                            }
                        };
                        
                        const delBtn = document.createElement('button');
                        delBtn.className = 'del-btn';
                        delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        delBtn.onclick = async () => {
                            await deleteDoc(doc(db, "shopping_matrix_inventory", item.id));
                        };

                        btn.appendChild(input);
                        btn.appendChild(delBtn);
                    } else {
                        // Normal mode button
                        btn.className = `shop-btn ${item.isActive ? 'active' : ''}`;
                        btn.textContent = item.name;
                        btn.draggable = true;
                        
                        btn.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('text/plain', item.id);
                            e.dataTransfer.effectAllowed = "move";
                        });

                        btn.onclick = async () => {
                            await updateDoc(doc(db, "shopping_matrix_inventory", item.id), { isActive: !item.isActive });
                        };
                    }
                    grid.appendChild(btn);
                });

                box.appendChild(grid);
                board.appendChild(box);
            });

            // Add "Create Category" widget at the bottom during Manage Mode
            if (state.isManageMode) {
                const addCatBox = document.createElement('div');
                addCatBox.className = 'add-cat-box';
                
                const input = document.createElement('input');
                input.id = 'inline-new-cat';
                input.placeholder = 'New category name...';
                input.className = 'cat-manage-input';
                input.style.width = '200px';

                const addBtn = document.createElement('button');
                addBtn.className = 'submit-btn';
                addBtn.textContent = 'Add Category';
                
                addBtn.onclick = async () => {
                    const newCat = input.value.trim();
                    if (newCat && !state.categories.includes(newCat)) {
                        await setDoc(configRef, { list: [...state.categories, newCat] });
                    }
                };

                addCatBox.appendChild(input);
                addCatBox.appendChild(addBtn);
                board.appendChild(addCatBox);
            }
        }

        // Event Listeners
        document.getElementById('toggle-view-btn').addEventListener('click', (e) => {
            state.isManageMode = !state.isManageMode;
            
            const toggleBtn = document.getElementById('toggle-view-btn'); 
            const customInput = document.getElementById('custom-input');
            
            if (state.isManageMode) {
                toggleBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Done Managing';
                toggleBtn.style.background = 'var(--accent)';
                toggleBtn.style.color = '#000';
                customInput.placeholder = 'Type to add item to Uncategorized...';
            } else {
                toggleBtn.innerHTML = '<i class="fa-solid fa-gear"></i> Manage';
                toggleBtn.style.background = '#333';
                toggleBtn.style.color = '#fff';
                customInput.placeholder = 'Type new item...';
            }
            
            renderShopBoard(); // Re-render in place
        });

        document.getElementById('custom-entry-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('custom-input');
            const itemName = input.value.trim();
            if (itemName === '') return;

            input.value = '';
            input.focus();

            if (!state.categories.includes("Uncategorized")) {
                await setDoc(configRef, { list: [...state.categories, "Uncategorized"] });
            }

            await addDoc(inventoryRef, {
                name: itemName,
                category: "Uncategorized",
                isActive: true
            });
        });

    </script>
</body>
</html>
