<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* --- Ultra-Condensed Body --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            gap: 10px; 
        }

        /* --- Horizontal Project Tabs --- */
        #projects-row {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        /* Hide scrollbar for cleaner look */
        #projects-row::-webkit-scrollbar { height: 4px; }
        #projects-row::-webkit-scrollbar-track { background: transparent; }
        #projects-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .tab-btn {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-btn.add {
            background: transparent;
            border: 1px dashed var(--border);
            padding: 8px 12px;
        }

        .tab-btn.add:hover {
            border-color: #4ade80;
            color: #4ade80;
        }

        #project-tabs {
            display: flex;
            gap: 8px;
        }

        /* --- Top Navigation & Input --- */
        #top-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--surface);
            padding: 10px 15px; 
            border-radius: 8px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        #custom-entry-form {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        #custom-input {
            flex: 1;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        #custom-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .submit-btn {
            background: var(--accent);
            color: #fff;
            padding: 6px 16px;
        }

        .submit-btn:hover { background: var(--accent-hover); }

        .manage-toggle-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 6px 16px;
            border: 1px solid var(--border);
        }

        .manage-toggle-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .manage-toggle-btn.active {
            background: var(--text-main);
            color: var(--bg-color);
        }

        /* --- Inbox Area --- */
        .inbox-container {
            background: var(--surface);
            border-radius: 8px;
            padding: 10px 15px; 
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            min-height: 40px; /* Kept tight as title is removed */
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        /* --- 4-Box Grid --- */
        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px; 
            flex: 1;
            min-height: 0; 
        }

        .matrix-box {
            background: var(--surface);
            border-radius: 8px;
            padding: 10px 15px; 
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            transition: all 0.2s ease;
            
            /* Background Image Properties */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Overlay to keep text readable over backgrounds */
        .matrix-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75); 
            border-radius: 8px;
            z-index: 0;
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.2s ease;
        }

        .matrix-box.has-bg::before {
            opacity: 1; 
        }

        .matrix-box.has-bg {
            background-color: transparent; 
        }

        .matrix-box.drag-over, .inbox-container.drag-over {
            border-color: var(--accent);
            background-color: var(--surface-hover);
        }
        
        .matrix-box.drag-over::before {
            background: rgba(51, 65, 85, 0.85); /* Slightly lighter overlay when hovering */
        }

        /* Ensure content stays above the overlay */
        .box-header, .items-container {
            position: relative;
            z-index: 1;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Lighter border for contrast */
            padding-bottom: 6px; 
            margin-bottom: 2px;
        }

        .box-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .edit-controls {
            display: flex;
            gap: 4px;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 4px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .header-btn:hover {
            color: var(--accent);
            background: rgba(255,255,255,0.05);
        }

        /* --- Task Items (Wrap Layout) --- */
        .items-container {
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap;     
            align-content: flex-start; 
            gap: 8px;            
            min-height: 30px; 
            flex: 1;
        }

        .task-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 6px 12px; 
            border-radius: 6px; 
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: grab;
            transition: all 0.2s ease;
            max-width: 100%; 
        }

        .task-item:active { cursor: grabbing; }

        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: #5a6b82;
        }

        .task-text {
            font-size: 0.9rem;
            pointer-events: none;
            word-break: break-word; 
        }

        /* --- Manage Mode Controls --- */
        .task-controls { display: none; gap: 4px; }
        .manage-only { display: none; }

        .manage-mode .task-controls { display: inline-flex; }
        .manage-mode .manage-only { display: inline-flex; }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 6px;
            font-size: 0.9rem;
            transition: color 0.2s;
            border-radius: 4px;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.05); }
        .icon-btn.edit:hover { color: var(--accent); }
        .icon-btn.delete:hover { color: var(--danger); }

    </style>
</head>
<body>

    <div id="projects-row">
        <button id="add-project-btn" class="tab-btn add" title="New Project"><i class="fa-solid fa-plus"></i></button>
        <div id="project-tabs"></div>
        <button id="rename-project-btn" class="icon-btn edit manage-only" title="Rename Active Project"><i class="fa-solid fa-pencil"></i></button>
        <button id="delete-project-btn" class="icon-btn delete manage-only" title="Delete Active Project"><i class="fa-solid fa-trash"></i></button>
    </div>

    <div id="top-bar">
        <form id="custom-entry-form">
            <input type="text" id="custom-input" placeholder="Type new item..." autocomplete="off" required>
            <button type="submit" class="submit-btn">Add</button>
        </form>
        <button id="toggle-manage-btn" class="manage-toggle-btn"><i class="fa-solid fa-pen-to-square"></i> Manage</button>
    </div>

    <!-- Inbox Area (Title Removed) -->
    <div id="box-inbox" class="inbox-container droppable" data-box-id="inbox">
        <div class="items-container" id="container-inbox"></div>
    </div>

    <!-- 4-Box Grid -->
    <div class="matrix-grid">
        <div class="matrix-box droppable" data-box-id="box1">
            <div class="box-header">
                <h2 class="box-title" id="title-box1">Title 1</h2>
                <div class="edit-controls">
                    <button class="header-btn" onclick="editBackground('box1')" title="Edit Background"><i class="fa-regular fa-image"></i></button>
                    <button class="header-btn" onclick="editTitle('box1')" title="Edit Title"><i class="fa-solid fa-pencil"></i></button>
                </div>
            </div>
            <div class="items-container" id="container-box1"></div>
        </div>

        <div class="matrix-box droppable" data-box-id="box2">
            <div class="box-header">
                <h2 class="box-title" id="title-box2">Title 2</h2>
                <div class="edit-controls">
                    <button class="header-btn" onclick="editBackground('box2')" title="Edit Background"><i class="fa-regular fa-image"></i></button>
                    <button class="header-btn" onclick="editTitle('box2')" title="Edit Title"><i class="fa-solid fa-pencil"></i></button>
                </div>
            </div>
            <div class="items-container" id="container-box2"></div>
        </div>

        <div class="matrix-box droppable" data-box-id="box3">
            <div class="box-header">
                <h2 class="box-title" id="title-box3">Title 3</h2>
                <div class="edit-controls">
                    <button class="header-btn" onclick="editBackground('box3')" title="Edit Background"><i class="fa-regular fa-image"></i></button>
                    <button class="header-btn" onclick="editTitle('box3')" title="Edit Title"><i class="fa-solid fa-pencil"></i></button>
                </div>
            </div>
            <div class="items-container" id="container-box3"></div>
        </div>

        <div class="matrix-box droppable" data-box-id="box4">
            <div class="box-header">
                <h2 class="box-title" id="title-box4">Title 4</h2>
                <div class="edit-controls">
                    <button class="header-btn" onclick="editBackground('box4')" title="Edit Background"><i class="fa-regular fa-image"></i></button>
                    <button class="header-btn" onclick="editTitle('box4')" title="Edit Title"><i class="fa-solid fa-pencil"></i></button>
                </div>
            </div>
            <div class="items-container" id="container-box4"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, writeBatch, query, where } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxKv-xXahSO2TEtwVwXTfU1eJ1ZsaaMAc",
            authDomain: "tasks-de4d9.firebaseapp.com",
            databaseURL: "https://tasks-de4d9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tasks-de4d9",
            storageBucket: "tasks-de4d9.firebasestorage.app",
            messagingSenderId: "908733856196",
            appId: "1:908733856196:web:b8d268a692a0e079be4c91"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const projectsRef = collection(db, "matrix_projects");
        const itemsRef = collection(db, "matrix_items");

        let state = {
            projects: [],
            activeProjectId: null,
            titles: {},
            backgrounds: {},
            items: [],
            isManageMode: false
        };

        let unsubscribeItems = null;

        // --- 1. INITIALIZATION & LISTENERS ---
        signInAnonymously(auth).then(() => {
            onSnapshot(projectsRef, async (snap) => {
                state.projects = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                if (state.projects.length === 0) {
                    const defaultDoc = await addDoc(projectsRef, {
                        name: "Default Project",
                        titles: { box1: "Quadrant 1", box2: "Quadrant 2", box3: "Quadrant 3", box4: "Quadrant 4" },
                        backgrounds: { box1: "", box2: "", box3: "", box4: "" }
                    });
                    state.projects.push({
                        id: defaultDoc.id, 
                        name: "Default Project", 
                        titles: { box1: "Quadrant 1", box2: "Quadrant 2", box3: "Quadrant 3", box4: "Quadrant 4" },
                        backgrounds: { box1: "", box2: "", box3: "", box4: "" }
                    });
                }

                renderProjectTabs();

                if (!state.activeProjectId || !state.projects.find(p => p.id === state.activeProjectId)) {
                    switchProject(state.projects[0].id);
                } else {
                    const currentProj = state.projects.find(p => p.id === state.activeProjectId);
                    state.titles = currentProj.titles || {};
                    state.backgrounds = currentProj.backgrounds || {};
                    updateQuadrantUI();
                }
            });
        }).catch((error) => console.error("Login failed:", error));


        // --- 2. PROJECT MANAGEMENT ---
        function renderProjectTabs() {
            const container = document.getElementById('project-tabs');
            container.innerHTML = '';
            
            const sortedProjects = [...state.projects].sort((a, b) => a.name.localeCompare(b.name));
            
            sortedProjects.forEach(proj => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${proj.id === state.activeProjectId ? 'active' : ''}`;
                btn.textContent = proj.name;
                btn.onclick = () => switchProject(proj.id);
                container.appendChild(btn);
            });
        }

        function switchProject(projectId) {
            state.activeProjectId = projectId;
            
            const proj = state.projects.find(p => p.id === projectId);
            state.titles = proj.titles || {box1: "Title 1", box2: "Title 2", box3: "Title 3", box4: "Title 4"};
            state.backgrounds = proj.backgrounds || {box1: "", box2: "", box3: "", box4: ""};
            
            renderProjectTabs(); // Re-render to update 'active' class
            updateQuadrantUI();

            if (unsubscribeItems) unsubscribeItems();

            const q = query(itemsRef, where("projectId", "==", projectId));
            unsubscribeItems = onSnapshot(q, (snap) => {
                state.items = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderItems();
            });
        }

        document.getElementById('add-project-btn').addEventListener('click', async () => {
            const name = prompt("Enter a name for the new project:");
            if (name && name.trim() !== "") {
                const docRef = await addDoc(projectsRef, {
                    name: name.trim(),
                    titles: { box1: "Quadrant 1", box2: "Quadrant 2", box3: "Quadrant 3", box4: "Quadrant 4" },
                    backgrounds: { box1: "", box2: "", box3: "", box4: "" }
                });
                switchProject(docRef.id);
            }
        });

        document.getElementById('rename-project-btn').addEventListener('click', async () => {
            const currentProj = state.projects.find(p => p.id === state.activeProjectId);
            const newName = prompt("Rename project:", currentProj.name);
            if (newName && newName.trim() !== "" && newName !== currentProj.name) {
                await updateDoc(doc(db, "matrix_projects", state.activeProjectId), { name: newName.trim() });
            }
        });

        document.getElementById('delete-project-btn').addEventListener('click', async () => {
            const currentProj = state.projects.find(p => p.id === state.activeProjectId);
            if (confirm(`Are you sure you want to delete the project "${currentProj.name}" and ALL of its items?`)) {
                
                const batch = writeBatch(db);
                state.items.forEach(item => {
                    batch.delete(doc(db, "matrix_items", item.id));
                });
                await batch.commit();

                await deleteDoc(doc(db, "matrix_projects", state.activeProjectId));
            }
        });

        // --- 3. UI RENDERING ---
        function updateQuadrantUI() {
            ['box1', 'box2', 'box3', 'box4'].forEach(boxId => {
                // Titles
                document.getElementById(`title-${boxId}`).textContent = state.titles[boxId] || `Quadrant ${boxId.replace('box','')}`;
                
                // Backgrounds
                const boxElement = document.querySelector(`[data-box-id="${boxId}"]`);
                if (state.backgrounds[boxId]) {
                    boxElement.style.backgroundImage = `url('${state.backgrounds[boxId]}')`;
                    boxElement.classList.add('has-bg');
                } else {
                    boxElement.style.backgroundImage = 'none';
                    boxElement.classList.remove('has-bg');
                }
            });
        }

        window.editTitle = async function(boxId) {
            const currentTitle = state.titles[boxId] || "";
            const newTitle = prompt("Enter new title for this quadrant:", currentTitle);
            
            if (newTitle !== null && newTitle.trim() !== "" && newTitle !== currentTitle) {
                const updatedTitles = { ...state.titles };
                updatedTitles[boxId] = newTitle.trim();
                await updateDoc(doc(db, "matrix_projects", state.activeProjectId), { titles: updatedTitles });
            }
        };

        window.editBackground = async function(boxId) {
            const currentBg = state.backgrounds[boxId] || "";
            const newBg = prompt("Enter image URL for background (leave blank to remove):", currentBg);
            
            if (newBg !== null && newBg.trim() !== currentBg) {
                const updatedBgs = { ...state.backgrounds };
                updatedBgs[boxId] = newBg.trim();
                await updateDoc(doc(db, "matrix_projects", state.activeProjectId), { backgrounds: updatedBgs });
            }
        };

        function renderItems() {
            ['inbox', 'box1', 'box2', 'box3', 'box4'].forEach(boxId => {
                document.getElementById(`container-${boxId}`).innerHTML = '';
            });

            const sortedItems = [...state.items].sort((a, b) => a.name.localeCompare(b.name));

            sortedItems.forEach(item => {
                const container = document.getElementById(`container-${item.boxId}`);
                if (!container) return;

                const div = document.createElement('div');
                div.className = 'task-item';
                div.draggable = true;
                
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', item.id);
                    e.dataTransfer.effectAllowed = "move";
                });

                div.innerHTML = `
                    <span class="task-text">${item.name}</span>
                    <div class="task-controls">
                        <button class="icon-btn edit" data-id="${item.id}" data-name="${item.name}"><i class="fa-solid fa-pencil"></i></button>
                        <button class="icon-btn delete" data-id="${item.id}"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });

            attachManageEventListeners();
        }

        // --- 4. ITEM INTERACTIONS ---
        document.getElementById('custom-entry-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('custom-input');
            const itemName = input.value.trim();
            if (itemName === '' || !state.activeProjectId) return;

            input.value = '';
            input.focus();

            await addDoc(itemsRef, {
                name: itemName,
                boxId: "inbox",
                projectId: state.activeProjectId
            });
        });

        document.getElementById('toggle-manage-btn').addEventListener('click', () => {
            state.isManageMode = !state.isManageMode;
            const btn = document.getElementById('toggle-manage-btn');
            
            if (state.isManageMode) {
                document.body.classList.add('manage-mode');
                btn.classList.add('active');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Done';
            } else {
                document.body.classList.remove('manage-mode');
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Manage';
            }
        });

        function attachManageEventListeners() {
            document.querySelectorAll('.icon-btn.edit:not(#rename-project-btn)').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute('data-id');
                    const currentName = btn.getAttribute('data-name');
                    const newName = prompt("Edit item name:", currentName);
                    if (newName !== null && newName.trim() !== "" && newName !== currentName) {
                        await updateDoc(doc(db, "matrix_items", id), { name: newName.trim() });
                    }
                };
            });

            document.querySelectorAll('.icon-btn.delete:not(#delete-project-btn)').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute('data-id');
                    if (confirm("Delete this item?")) {
                        await deleteDoc(doc(db, "matrix_items", id));
                    }
                };
            });
        }

        // --- 5. DRAG AND DROP ---
        const dropZones = document.querySelectorAll('.droppable');

        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', async (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                
                const itemId = e.dataTransfer.getData('text/plain');
                const newBoxId = zone.getAttribute('data-box-id');
                
                if (itemId && newBoxId) {
                    await updateDoc(doc(db, "matrix_items", itemId), { boxId: newBoxId });
                }
            });
        });

    </script>
</body>
</html>
